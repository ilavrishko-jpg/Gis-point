  /* Вибір сценарію: ручний вибір людини головніший за здогад апки. */
  function pickPlaybook(row) {
    var t = state.touch[row.__id];
    if (t && t.playbook && PLAYBOOKS[t.playbook]) return PLAYBOOKS[t.playbook];
    var src = norm(row.__source || "");
    if (src.indexOf("flyby") > -1 || src.indexOf("fly by") > -1) return PLAYBOOKS.flyby;
    /* лід з ІТ-бази, помічений як ціль FLY BY, теж іде за технічним сценарієм */
    if (row.__hay && (row.__hay.indexOf("fly by oem") > -1 || row.__hay.indexOf("flyby oem") > -1)) {
      return PLAYBOOKS.flyby;
    }
    return PLAYBOOKS.itout;
  }

  function buildPrompt(row, pb) {
    var lines = [];
    state.columns.forEach(function (c) { if (row[c]) lines.push(c + ": " + row[c]); });
    var t = state.touch[row.__id];
    if (t && t.summary) lines.push("Мій підсумок: " + t.summary);
    if (t && t.log && t.log.length) {
      lines.push("Історія контактів: " + t.log.map(function (e) {
        return shortTime(e.at) + " — " + e.text;
      }).join(" // "));
    }
    return [
      "Ти — досвідчений технічний продавець GIS-Point на виставці MSPO 2026. " +
      "Готуєш менеджера до розмови біля стенда: за пів хвилини він має зрозуміти, про що питати.",
      "",
      "ПРО НАШЕ РІШЕННЯ (це факти, не виходь за них і не додавай характеристик, яких тут немає):",
      pb.key === "flyby" ? state.brief.flyby : state.brief.itout,
      "",
      "ЛІД:",
      lines.join("\n"),
      "",
      pb.lead,
      pb.task,
      "",
      "ЯК ВІДПОВІДАТИ:",
      "— Українською, стисло, без вступів і без ввічливих формул.",
      "— Кожне питання має чіплятися за конкретний факт з даних про ліда. Загальні питання, " +
      "які годяться будь-кому, не пиши.",
      "— Не питай про те, що вже написано в даних. Якщо факт відомий — став наступне питання, глибше.",
      "— Питання відкриті: на них не можна відповісти «так» або «ні».",
      "— Де даних бракує, прямо напиши, що це треба з'ясувати першим, і як саме спитати.",
      "— Нічого не вигадуй про цю компанію: якщо чогось не знаєш — так і скажи.",
      "— Розділи відповідь заголовками з завдання, по кілька рядків у кожному."
    ].join("\n");
  }

  /* ================= скринінг ліда =================
     Один екран — одне питання. Англійський текст великим (його читають
     уголос), українська підказка дрібним. Чернетка тримається в
     localStorage, щоб перезавантаження посеред розмови нічого не з'їло. */

  var SCR = window.SR_SCREENING;
  var LS_DRAFT = "sr.screening.draft.v1";
  var draft = null;

  function newDraft(leadId, row) {
    var t = state.touch[leadId] && state.touch[leadId].screening;
    return {
      leadId: leadId,
      clientType: (t && t.clientType) || "",
      hasOwnSoftware: !!(t && t.hasOwnSoftware),
      answers: (t && t.answers) ? JSON.parse(JSON.stringify(t.answers)) : {},
      paidPilot: t ? t.paidPilot === true : null,
      crossSellDone: !!(t && t.crossSellDone),
      promised: (t && t.promised) || "",
      followUpSent: !!(t && t.followUpSent),
      stopped: false,
      step: 0
    };
  }
  function saveDraft() { if (draft) lsSet(LS_DRAFT, draft); }
  function dropDraft() { draft = null; lsDel(LS_DRAFT); }

  /* Тип клієнта підказуємо за джерелом ліда, але ставить його людина. */
  function suggestType(row) {
    var src = norm(row.__source || "");
    if (src.indexOf("flyby") > -1 || src.indexOf("fly by") > -1) return "UAV_OEM";
    return "STAFF_GAP";
  }

  function buildSteps(d) {
    var t = SCR.typeById(d.clientType);
    if (d.stopped || (t && t.exitOnly)) return [{ kind: "exit" }];
    var steps = [{ kind: "type" }];
    if (!t) return steps;
    SCR.getQuestionsFor(d.clientType).forEach(function (q) { steps.push({ kind: "q", q: q }); });
    steps.push({ kind: "h6", q: SCR.H6_QUESTION });
    if (t.crossSell && d.hasOwnSoftware) {
      SCR.CROSS_SELL.questions.forEach(function (q) { steps.push({ kind: "xs", q: q }); });
    }
    steps.push({ kind: "final" });
    return steps;
  }

  function currentScore(d) {
    var t = SCR.typeById(d.clientType);
    var xsDone = !!(t && t.crossSell && d.hasOwnSoftware) &&
      SCR.CROSS_SELL.questions.every(function (q) {
        var a = d.answers[q.id];
        return a && String(a.value).trim();
      });
    return SCR.score(d.clientType, d.answers, {
      paidPilot: d.paidPilot === true,
      crossSellDone: xsDone
    });
  }

  function openScreening(row) {
    draft = newDraft(row.__id, row);
    draft.step = 0;          /* завжди починаємо з підтвердження типу */
    saveDraft();
    pushSheet(buildScreeningSheet(row));
  }

  function rerender(row) {
    saveDraft();
    var old = sheetStack[sheetStack.length - 1];
    if (!old) return;
    var fresh = buildScreeningSheet(row);
    old.replaceWith(fresh);
    sheetStack[sheetStack.length - 1] = fresh;
  }

  function buildScreeningSheet(row) {
    var sheet = el("div", "sheet");
    var steps = buildSteps(draft);
    if (draft.step >= steps.length) draft.step = steps.length - 1;
    if (draft.step < 0) draft.step = 0;
    var step = steps[draft.step];

    sheet.appendChild(sheetHead("Скринінг · " + (val(row, "company") || row.__company), function () {
      dropDraft();
      popSheet();
    }));
    var body = el("div", "sheet-body"), inner = el("div", "sheet-inner");
    body.appendChild(inner);
    sheet.appendChild(body);

    if (step.kind === "type") inner.appendChild(typeScreen(row));
    else if (step.kind === "exit") inner.appendChild(exitScreen(row));
    else if (step.kind === "final") inner.appendChild(finalScreen(row));
    else inner.appendChild(questionScreen(row, step, steps));

    return sheet;
  }

  /* --- екран вибору типу --- */
  function typeScreen(row) {
    var box = el("div", "sect");
    box.appendChild(el("span", "eyebrow", "Хто це"));
    var suggested = suggestType(row);
    box.appendChild(el("p", "note-inline", "Тип задає набір питань. Підказано за джерелом ліда — виправ, якщо не так."));

    var list = el("div", "type-list");
    SCR.CLIENT_TYPES.forEach(function (t) {
      var b = el("button", "type-btn" + (draft.clientType === t.id ? " on" : ""));
      b.type = "button";
      var top = el("div", "type-top");
      top.appendChild(el("span", "type-name", t.label));
      if (t.id === suggested && !draft.clientType) top.appendChild(el("span", "type-sug", "підказано"));
      top.appendChild(el("span", "type-route", "→ " + SCR.ROUTES[t.route].label));
      b.appendChild(top);
      b.appendChild(el("span", "type-hint", t.hint));
      b.addEventListener("click", function () {
        var changed = draft.clientType !== t.id;
        draft.clientType = t.id;
        if (changed) draft.answers = {};   /* інший тип — інші питання */
        draft.step = 1;
        rerender(row);
      });
      list.appendChild(b);
    });
    box.appendChild(list);
    return box;
  }

  /* --- екран одного питання --- */
  function questionScreen(row, step, steps) {
    var q = step.q;
    var box = el("div", "sect scr");
    var qSteps = steps.filter(function (s) { return s.kind === "q"; });
    var idx = qSteps.indexOf(step);

    var head = el("div", "scr-head");
    head.appendChild(el("span", "eyebrow", SCR.typeById(draft.clientType).label));
    if (idx > -1) head.appendChild(el("span", "scr-progress", (idx + 1) + " / " + qSteps.length));
    else head.appendChild(el("span", "scr-progress", step.kind === "h6" ? "останнє" : "крос-продаж"));
    box.appendChild(head);

    box.appendChild(el("h2", "scr-q", q.textEn));
    if (q.hintUa) box.appendChild(el("p", "scr-hint", q.hintUa));

    var a = draft.answers[q.id] || { value: "", flag: false };
    var field = el("div", "scr-field");

    function setValue(v) {
      draft.answers[q.id] = { value: v, flag: (draft.answers[q.id] || {}).flag === true };
      if (q.id === SCR.H6_QUESTION.id) draft.paidPilot = v === true;
      saveDraft();
    }

    if (q.answerType === "single") {
      q.options.forEach(function (o) {
        var b = el("button", "opt" + (a.value === o[0] ? " on" : ""));
        b.type = "button";
        b.appendChild(el("span", null, o[1]));
        if (q.hotValues && q.hotValues.indexOf(o[0]) > -1) b.appendChild(el("span", "opt-hot", "сигнал"));
        if (q.disqualifyValues && q.disqualifyValues.indexOf(o[0]) > -1) b.appendChild(el("span", "opt-stop", "стоп"));
        b.addEventListener("click", function () {
          setValue(o[0]);
          advance(row, q);
        });
        field.appendChild(b);
      });
    } else if (q.answerType === "boolean") {
      [[true, "Yes"], [false, "No"]].forEach(function (o) {
        var b = el("button", "opt" + (a.value === o[0] ? " on" : ""));
        b.type = "button";
        b.textContent = o[1];
        b.addEventListener("click", function () {
          setValue(o[0]);
          advance(row, q);
        });
        field.appendChild(b);
      });
    } else if (q.answerType === "number") {
      var ni = el("input", "scr-in");
      ni.type = "number";
      ni.inputMode = "numeric";
      ni.placeholder = "число";
      ni.value = a.value === "" ? "" : a.value;
      ni.addEventListener("input", function () { setValue(ni.value); });
      field.appendChild(ni);
    } else if (q.answerType === "date") {
      var di = el("input", "scr-in");
      di.type = "date";
      di.value = a.value || "";
      di.addEventListener("change", function () { setValue(di.value); });
      field.appendChild(di);
    } else {
      var ta = el("textarea", "note");
      ta.placeholder = "Записати дослівно…";
      ta.value = a.value || "";
      ta.addEventListener("input", function () { setValue(ta.value); });
      field.appendChild(ta);
      field.appendChild(voiceTools(ta));
      if (q.passFlag) {
        var lab = el("label", "flagbox");
        var cb = el("input");
        cb.type = "checkbox";
        cb.checked = a.flag === true;
        cb.addEventListener("change", function () {
          draft.answers[q.id] = { value: (draft.answers[q.id] || {}).value || "", flag: cb.checked };
          saveDraft();
        });
        lab.appendChild(cb);
        lab.appendChild(el("span", null, q.passFlag));
        field.appendChild(lab);
      }
    }
    box.appendChild(field);

    var nav = el("div", "scr-nav");
    if (draft.step > 0) {
      var back = el("button", "btn", "Назад");
      back.addEventListener("click", function () { draft.step--; rerender(row); });
      nav.appendChild(back);
    }
    var next = el("button", "btn primary", "Далі");
    next.addEventListener("click", function () { advance(row, q); });
    nav.appendChild(next);
    box.appendChild(nav);
    return box;
  }

  /* Дискваліфікаційна відповідь обриває набір одразу. */
  function advance(row, q) {
    if (q && SCR.isDisqualified(q, draft.answers[q.id])) {
      draft.stopped = true;
      draft.stopSuggest = q.suggestType || null;
      draft.step = 0;
      rerender(row);
      return;
    }
    draft.step++;
    rerender(row);
  }

  /* --- екран виходу: три готові фрази --- */
  function exitScreen(row) {
    var box = el("div", "sect");
    var stopped = draft.stopped;
    box.appendChild(el("span", "eyebrow", stopped ? "Стоп — далі не йдемо" : "Не наш профіль"));
    if (stopped) {
      var v = el("div", "verdict stop");
      v.appendChild(el("span", "verdict-l", "STOP"));
      v.appendChild(el("span", "verdict-n", "Спрацював дискваліфікатор."));
      box.appendChild(v);
      if (draft.stopSuggest) {
        var sug = el("button", "btn wide", "Змінити тип на «" + SCR.typeById(draft.stopSuggest).label + "»");
        sug.style.marginBottom = "12px";
        sug.addEventListener("click", function () {
          draft.clientType = draft.stopSuggest;
          draft.stopped = false;
          draft.stopSuggest = null;
          draft.answers = {};
          draft.step = 0;
          rerender(row);
        });
        box.appendChild(sug);
      }
    }
    box.appendChild(el("p", "note-inline", "Згорнути розмову за 30 секунд:"));
    SCR.EXIT_LINES.forEach(function (pair) {
      var d = el("details", "raw pb-group");
      d.appendChild(el("summary", null, pair[0]));
      var p = el("p", "scr-line", pair[1]);
      d.appendChild(p);
      box.appendChild(d);
    });
    var save = el("button", "btn primary wide", "Зберегти візитку і закрити");
    save.style.marginTop = "14px";
    save.addEventListener("click", function () { saveScreening(row); });
    box.appendChild(save);
    return box;
  }

  /* --- фінальний екран --- */
  function finalScreen(row) {
    var box = el("div", "sect");
    var r = currentScore(draft);
    var vd = SCR.VERDICTS[r.verdict];

    box.appendChild(el("span", "eyebrow", "Вердикт"));
    var v = el("div", "verdict " + r.verdict.toLowerCase());
    v.appendChild(el("span", "verdict-l", vd.label));
    v.appendChild(el("span", "verdict-n", vd.note));
    box.appendChild(v);

    var hy = el("div", "hyp");
    SCR.HYPOTHESES.forEach(function (h) {
      var on = r.hypotheses.indexOf(h[0]) > -1;
      var li = el("div", "hyp-row" + (on ? " on" : ""));
      li.appendChild(el("span", "hyp-k", h[0]));
      li.appendChild(el("span", "hyp-t", h[1]));
      li.appendChild(el("span", "hyp-m", on ? "✓" : "—"));
      hy.appendChild(li);
    });
    box.appendChild(hy);
    box.appendChild(el("p", "note-inline", "Підтверджено " + r.count + " з 6."));

    if (r.geoFilterFailed) {
      var warn = el("p", "note-inline");
      warn.style.color = "var(--warn)";
      warn.textContent = "Гео-фільтр не пройдено: працюють поза нашими ринками.";
      box.appendChild(warn);
    }
    if (r.hotSignals.length) {
      var hot = el("p", "note-inline");
      hot.style.color = "var(--hot)";
      hot.textContent = "Гарячий сигнал у відповідях — не відкладай.";
      box.appendChild(hot);
    }

    var fu = el("div", "sect");
    fu.style.borderBottom = "none";
    fu.style.paddingBottom = "0";
    fu.appendChild(el("span", "eyebrow", "Що надсилаємо · маршрут " +
      r.routes.map(function (k) { return k; }).join(" + ")));
    var ul = el("ul", "pb-list followup");
    r.followUp.forEach(function (t) { ul.appendChild(el("li", null, t)); });
    fu.appendChild(ul);
    box.appendChild(fu);

    var pl = el("label", "field");
    pl.appendChild(el("span", null, "Що пообіцяли"));
    var pi = el("input", "summary-in");
    pi.type = "text";
    pi.placeholder = "Напр. надіслати специфікацію до пʼятниці";
    pi.value = draft.promised || "";
    pi.addEventListener("input", function () { draft.promised = pi.value; saveDraft(); });
    pl.appendChild(pi);
    box.appendChild(pl);

    var sent = el("label", "flagbox");
    var scb = el("input");
    scb.type = "checkbox";
    scb.checked = draft.followUpSent === true;
    scb.addEventListener("change", function () { draft.followUpSent = scb.checked; saveDraft(); });
    sent.appendChild(scb);
    sent.appendChild(el("span", null, "Фолоу-ап уже надіслано"));
    box.appendChild(sent);

    var nav = el("div", "scr-nav");
    var back = el("button", "btn", "Назад");
    back.addEventListener("click", function () { draft.step--; rerender(row); });
    nav.appendChild(back);
    var save = el("button", "btn primary", "Зберегти");
    save.addEventListener("click", function () { saveScreening(row); });
    nav.appendChild(save);
    box.appendChild(nav);
    return box;
  }

  /* Зберігаємо разом з контактом: тип, маршрути, відповіді дослівно,
     гіпотези, вердикт, дату наступного вікна, обіцянку, стан фолоу-апу. */
  function saveScreening(row) {
    var r = currentScore(draft);
    var nextDate = "";
    SCR.getQuestionsFor(draft.clientType).forEach(function (q) {
      if (q.answerType === "date" && draft.answers[q.id] && draft.answers[q.id].value) {
        nextDate = draft.answers[q.id].value;
      }
    });
    setTouch(row.__id, {
      screening: {
        clientType: draft.clientType,
        hasOwnSoftware: draft.hasOwnSoftware,
        answers: draft.answers,
        paidPilot: draft.paidPilot,
        crossSellDone: r.routes.indexOf("H") > -1,
        hypotheses: r.hypotheses,
        verdict: r.verdict,
        routes: r.routes,
        followUp: r.followUp,
        geoFilterFailed: r.geoFilterFailed,
        nextDate: nextDate,
        promised: draft.promised,
        followUpSent: draft.followUpSent,
        at: nowISO(),
        by: state.me || ""
      }
    });
    /* вердикт лягає ще й у журнал, щоб історія була в одному місці */
    addLogEntry(row.__id, "Скринінг: " + r.verdict + " · " +
      SCR.typeById(draft.clientType).label +
      (r.hypotheses.length ? " · гіпотези " + r.hypotheses.join(", ") : "") +
      (draft.promised ? " · пообіцяли: " + draft.promised : ""));
    dropDraft();
    /* картка під нами вже має показувати підсумок, тож перебудовуємо її
       до закриття — після popSheet дістатись до неї вже ніяк */
    var parent = sheetStack[sheetStack.length - 2];
    if (parent) {
      var fresh = buildLeadSheet(row);
      parent.replaceWith(fresh);
      sheetStack[sheetStack.length - 2] = fresh;
    }
    popSheet();
    toast("Скринінг збережено: " + r.verdict);
  }

  /* Блок у картці ліда: запуск або підсумок уже пройденого. */
  function screeningSection(row) {
    var sect = el("div", "sect");
    sect.appendChild(el("span", "eyebrow", "Скринінг"));
    var done = state.touch[row.__id] && state.touch[row.__id].screening;

    if (done && done.verdict) {
      var v = el("div", "verdict " + String(done.verdict).toLowerCase());
      v.appendChild(el("span", "verdict-l", done.verdict));
      v.appendChild(el("span", "verdict-n",
        (SCR.typeById(done.clientType) ? SCR.typeById(done.clientType).label : done.clientType) +
        " · " + (done.hypotheses || []).length + " з 6"));
      sect.appendChild(v);
      if ((done.followUp || []).length) {
        var ul = el("ul", "pb-list followup");
        done.followUp.forEach(function (t) { ul.appendChild(el("li", null, t)); });
        sect.appendChild(ul);
      }
      if (done.promised) sect.appendChild(el("p", "note-inline", "Пообіцяли: " + done.promised));
    } else {
      sect.appendChild(el("p", "note-inline", "3–5 питань під тип клієнта, бал гіпотез і вердикт про потенціал."));
    }

    var b = el("button", "btn wide" + (done ? "" : " primary"), done ? "Пройти ще раз" : "Почати скринінг");
    b.addEventListener("click", function () { openScreening(row); });
    sect.appendChild(b);

    /* прапорець власного софту — вмикає крос-продажний блок */
    var t = done ? SCR.typeById(done.clientType) : null;
    var showFlag = !t || t.crossSell;
    if (showFlag) {
      var lab = el("label", "flagbox");
      var cb = el("input");
      cb.type = "checkbox";
      cb.checked = !!(done && done.hasOwnSoftware);
      cb.addEventListener("change", function () {
        var cur = (state.touch[row.__id] && state.touch[row.__id].screening) || {};
        cur.hasOwnSoftware = cb.checked;
        setTouch(row.__id, { screening: cur });
      });
      lab.appendChild(cb);
      lab.appendChild(el("span", null, "Має власний софт — питати ще й про software development"));
      sect.appendChild(lab);
    }
    return sect;
  }

  /* ================= картка ліда ================= */
  function openLead(id) {
    var row = null, i;
    for (i = 0; i < state.rows.length; i++) if (state.rows[i].__id === id) { row = state.rows[i]; break; }
    if (!row) return;
    pushSheet(buildLeadSheet(row));
  }

  function buildLeadSheet(row) {
    var sheet = el("div", "sheet");
    sheet.appendChild(sheetHead(row.__company, popSheet));
    var body = el("div", "sheet-body"), inner = el("div", "sheet-inner");
    body.appendChild(inner); sheet.appendChild(body);
    var cur = state.touch[row.__id] || {};

    /* шапка */
    var head = el("div", "lead-head");
    head.appendChild(el("h1", "lead-name", row.__company));
    var facts = el("div", "lead-facts");
    if (row.__pstatus) facts.appendChild(el("span", "pbadge " + pstatusClass(row.__pstatus), row.__pstatus));
    if (row.__meet) facts.appendChild(el("span", "fact stand", "Зустріч " + row.__meet));
    var stand = val(row, "stand");
    if (stand && /\d/.test(stand)) {
      var fs = el("span", "fact stand");
      fs.appendChild(el("small", null, "Стенд"));
      fs.appendChild(el("span", "mono", " " + stand));
      facts.appendChild(fs);
    } else if (stand) {
      facts.appendChild(el("span", "fact", "Стенд " + stand));
    }
    if (row.__tier) facts.appendChild(el("span", "fact tier", "Пріоритет " + row.__tier));
    [val(row, "country"), val(row, "segment")].forEach(function (v) {
      if (v) facts.appendChild(el("span", "fact", v));
    });
    if (state.sources.length > 1) facts.appendChild(el("span", "fact", row.__source || "База"));
    head.appendChild(facts);
    if (row["Компанія визначена"]) {
      var warn = el("p", "note-inline", "Назву компанії відновлено " + row["Компанія визначена"] + " — у файлі клітинка порожня.");
      warn.style.margin = "9px 0 0";
      head.appendChild(warn);
    }
    inner.appendChild(head);

    /* що з ним робити */
    var offer = val(row, "offer"), baseNote = val(row, "note");
    if (offer || baseNote) {
      var s0 = el("div", "sect");
      s0.appendChild(el("span", "eyebrow", "Що з ним робити"));
      if (offer) s0.appendChild(el("div", "hintbox", offer));
      if (baseNote) {
        var bn = el("p", "note-inline", baseNote);
        bn.style.margin = offer ? "10px 0 0" : "0";
        bn.style.color = "var(--text)";
        s0.appendChild(bn);
      }
      inner.appendChild(s0);
    }

    /* результат на стенді */
    var s1 = el("div", "sect");
    s1.appendChild(el("span", "eyebrow", "Результат розмови"));
    var grid = el("div", "statusgrid");
    STATUSES.forEach(function (s) {
      var b = el("button", "sbtn " + s.k + (cur.status === s.k ? " on" : ""));
      b.type = "button";
      b.appendChild(el("span", "sdot " + s.k));
      b.appendChild(document.createTextNode(s.label));
      b.addEventListener("click", function () {
        setTouch(row.__id, { status: cur.status === s.k ? "" : s.k });
        refreshLeadSheet(row);
      });
      grid.appendChild(b);
    });
    s1.appendChild(grid);
    inner.appendChild(s1);

    /* фікс година: у базі вона є лише в трьох, решту виставляють тут */
    var sM = el("div", "sect");
    sM.appendChild(el("span", "eyebrow", "Фіксована година зустрічі"));
    var em = effMeet(row);
    var mIn = el("input");
    mIn.type = "datetime-local";
    mIn.className = "meet-in";
    if (em && em.date) mIn.value = toLocalInput(em.date);
    mIn.addEventListener("change", function () {
      if (!mIn.value) { setTouch(row.__id, { meetAt: "" }); refreshLeadSheet(row); return; }
      var d = new Date(mIn.value);
      if (isNaN(d.getTime())) return;
      setTouch(row.__id, { meetAt: d.toISOString() });
      refreshLeadSheet(row);
      toast("Зустріч о " + fmtMeet(d));
    });
    sM.appendChild(mIn);
    var mHint = el("p", "note-inline");
    if (em && em.fixed && !em.mine) mHint.textContent = "З бази: " + em.label + ". Зміни тут, якщо домовились інакше.";
    else if (em && !em.fixed) mHint.textContent = "У базі стоїть лише день (" + em.label + ") — постав годину, і лід з'явиться у смузі «За годиною».";
    else if (em && em.mine) {
      mHint.textContent = "Виставлено вручну. ";
      var clr = el("button", null, "Прибрати годину");
      clr.style.cssText = "font-weight:600;color:var(--accent-ink);text-decoration:underline";
      clr.addEventListener("click", function () { setTouch(row.__id, { meetAt: "" }); refreshLeadSheet(row); });
      mHint.appendChild(clr);
    } else mHint.textContent = "Домовились про час на стенді — постав його тут, і лід з'явиться у смузі «За годиною» вгорі списку.";
    sM.appendChild(mHint);
    inner.appendChild(sM);

    /* головне по ліду — один рядок, видно зі списку */
    var s2 = el("div", "sect");
    s2.appendChild(el("span", "eyebrow", "Головне по цьому ліду"));
    var sIn = el("input", "summary-in");
    sIn.type = "text";
    sIn.placeholder = "Один рядок: про що домовились, що вирішує";
    sIn.value = cur.summary || "";
    var sTimer = null;
    sIn.addEventListener("input", function () {
      clearTimeout(sTimer);
      sTimer = setTimeout(function () { setTouch(row.__id, { summary: sIn.value }, true); }, 600);
    });
    sIn.addEventListener("blur", function () {
      clearTimeout(sTimer);
      setTouch(row.__id, { summary: sIn.value }, true);
    });
    s2.appendChild(sIn);
    s2.appendChild(el("p", "note-inline", "Цей рядок показується просто в списку — щоб на другій зустрічі не відкривати картку."));
    inner.appendChild(s2);

    /* журнал: кожен контакт окремим записом */
    var s3 = el("div", "sect");
    s3.appendChild(el("span", "eyebrow", "Журнал контактів"));
    var addBox = el("div", "logadd");
    var ta = el("textarea", "note");
    ta.placeholder = "Що обговорили, що пообіцяли, кому передати…";
    var addBtn = el("button", "btn primary", "Додати запис");
    addBtn.addEventListener("click", function () {
      var txt = ta.value.trim();
      if (!txt) { ta.focus(); return; }
      addLogEntry(row.__id, txt);
      ta.value = "";
      refreshLeadSheet(row);
      toast("Записано");
    });
    addBox.appendChild(ta);
    addBox.appendChild(voiceTools(ta));
    addBox.appendChild(addBtn);
    s3.appendChild(addBox);

    var log = (cur.log || []).slice().sort(function (a, b) { return a.at < b.at ? 1 : -1; });
    if (!log.length) {
      s3.appendChild(el("p", "logempty", "Записів ще немає. Кожен запис отримує час і автора — так видно всю історію контактів з лідом."));
    } else {
      log.forEach(function (entry) { s3.appendChild(logNode(row, entry)); });
    }
    inner.appendChild(s3);

    /* контакти */
    var links = [], email = val(row, "email"), phone = val(row, "phone"), site = val(row, "website");
    if (phone) links.push(["tel:" + phone.replace(/[^\d+]/g, ""), "Подзвонити", phone, iconPhone()]);
    if (email) links.push(["mailto:" + email, "Написати", email, iconMail()]);
    if (site) {
      var isLi = /linkedin/i.test(site);
      links.push([site.match(/^https?:/i) ? site : "https://" + site.replace(/^\/+/, ""),
        isLi ? "LinkedIn" : "Сайт", site.replace(/^https?:\/\/(www\.)?/, ""), iconGlobe()]);
    }
    if (links.length || val(row, "person")) {
      var s4 = el("div", "sect");
      s4.appendChild(el("span", "eyebrow", "Контакт"));
      if (val(row, "person")) {
        var dl0 = el("dl", "kv");
        dl0.appendChild(kvRow("Людина", val(row, "person")));
        if (val(row, "role")) dl0.appendChild(kvRow("Посада", val(row, "role")));
        s4.appendChild(dl0);
      }
      if (links.length) {
        var lg = el("div", "linkgrid");
        lg.style.marginTop = val(row, "person") ? "10px" : "0";
        links.forEach(function (L) {
          var a = el("a", "linkbtn");
          a.href = L[0];
          if (L[1] !== "Подзвонити" && L[1] !== "Написати") { a.target = "_blank"; a.rel = "noopener noreferrer"; }
          a.innerHTML = L[3];
          var lab = el("div", "l");
          lab.appendChild(el("small", null, L[1]));
          lab.appendChild(el("span", null, L[2]));
          a.appendChild(lab);
          lg.appendChild(a);
        });
        s4.appendChild(lg);
      }
      inner.appendChild(s4);
    }

    inner.appendChild(screeningSection(row));
    inner.appendChild(playbookSection(row));

    /* усі поля */
    var s6 = el("div", "sect");
    s6.style.borderBottom = "none";
    var det = el("details", "raw");
    det.appendChild(el("summary", null, "Усі поля з бази"));
    var dl = el("dl", "kv");
    state.columns.forEach(function (c) { if (row[c]) dl.appendChild(kvRow(c, row[c])); });
    det.appendChild(dl);
    s6.appendChild(det);
    inner.appendChild(s6);

    return sheet;
  }

  /* Диктування.

     Розпізнає сам браузер — аудіо нікуди не пишеться, у журнал лягає текст.
     Головна причина, чому воно не вмикається: сторінка живе у вбудованому
     вікні (iframe), і доступ до мікрофона туди не делегований. Зсередини
     сторінки це не полагодити, тож апка мусить чесно сказати про це і дати
     робочий обхід: відкрити себе окремою вкладкою, де дозвіл належить самій
     сторінці, або надиктувати з клавіатури телефона. */
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var LANGS = [["uk-UA", "УКР"], ["en-US", "ENG"]];
  var IS_FRAMED = (function () { try { return window.self !== window.top; } catch (e) { return true; } })();
  var IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
    (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

  function micErrorText(name) {
    switch (name) {
      case "NotAllowedError":
      case "SecurityError":
        return IS_FRAMED
          ? "Мікрофон недоступний у вбудованому вікні — дозвіл сюди не передається. Відкрий апку окремою вкладкою, там диктування працює."
          : "Браузер не дав доступ до мікрофона. Дозволь його для цього сайту в налаштуваннях і спробуй ще раз.";
      case "NotFoundError":
      case "OverconstrainedError":
        return "Мікрофон не знайдено — підключеного входу немає. Диктуй з клавіатури телефона.";
      case "NotReadableError":
        return "Мікрофон зайнятий іншою програмою — закрий її і спробуй ще раз.";
      default:
        return "Мікрофон не увімкнувся (" + name + ").";
    }
  }

  function voiceTools(textarea) {
    var wrap = el("div", "logtools");
    var note = el("p", "micnote");
    note.style.width = "100%";

    /* Клавіатура телефона диктує в будь-яке поле і не залежить від дозволів
       сторінки — у залі це найнадійніший шлях, тож кажемо про нього одразу. */
    var tip = el("p", "micnote");
    tip.style.width = "100%";
    tip.textContent = "Порада: на телефоні можна натиснути мікрофон на клавіатурі — це диктує прямо в поле й працює завжди.";

    function setNote(text, isErr) {
      note.textContent = text || "";
      note.classList.toggle("err", !!isErr);
    }
    /* Кнопка, що відкриває цю ж сторінку верхнім рівнем: там дозвіл на
       мікрофон належить сторінці, а не господарю рамки. */
    function offerNewTab() {
      if (wrap.querySelector(".opentab")) return;
      var a = el("a", "btn opentab", "Відкрити окремою вкладкою");
      a.href = location.href;
      a.target = "_blank";
      a.rel = "noopener";
      a.style.marginTop = "8px";
      wrap.appendChild(a);
    }

    if (!SR) {
      setNote("Цей браузер не вміє розпізнавати мову. Працює в Chrome і Safari — або диктуй з клавіатури телефона.");
      wrap.appendChild(note);
      wrap.appendChild(tip);
      return wrap;
    }

    var lang = lsGet("sr.lang") || "uk-UA";
    var rec = null, recording = false, baseText = "";

    var btn = el("button", "micbtn");
    btn.type = "button";
    btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3"/></svg>';
    var label = el("span", null, "Диктувати");
    btn.appendChild(label);

    var langBtn = el("button", "langbtn");
    langBtn.type = "button";
    function langLabel() {
      var f = LANGS.filter(function (l) { return l[0] === lang; })[0];
      langBtn.textContent = f ? f[1] : lang;
    }
    langLabel();
    langBtn.addEventListener("click", function () {
      var i = LANGS.map(function (l) { return l[0]; }).indexOf(lang);
      lang = LANGS[(i + 1) % LANGS.length][0];
      lsSet("sr.lang", lang);
      langLabel();
      if (recording) stop();
    });

    function stop() {
      recording = false;
      btn.classList.remove("rec");
      label.textContent = "Диктувати";
      if (rec) {
        try { rec.onend = null; rec.stop(); } catch (e) {}
        rec = null;
      }
    }

    function startRecognition() {
      try { rec = new SR(); } catch (e) {
        setNote("Розпізнавання не запустилось (" + e.name + ").", true);
        stop();
        return;
      }
      rec.lang = lang;
      /* На iOS безперервний режим обривається після першої фрази —
         там слухаємо короткими відрізками і перезапускаємось самі. */
      rec.continuous = !IS_IOS;
      rec.interimResults = true;
      rec.onresult = function (e) {
        var fin = "", interim = "", i;
        for (i = e.resultIndex; i < e.results.length; i++) {
          if (e.results[i].isFinal) fin += e.results[i][0].transcript;
          else interim += e.results[i][0].transcript;
        }
        if (fin) baseText += fin.replace(/^\s+/, "") + " ";
        textarea.value = baseText + interim;
        textarea.scrollTop = textarea.scrollHeight;
      };
      rec.onerror = function (e) {
        var code = e && e.error;
        if (code === "no-speech") { setNote("Не почув голосу — говори ближче до мікрофона."); return; }
        if (code === "aborted") return;
        if (code === "not-allowed" || code === "service-not-allowed") {
          setNote(micErrorText("NotAllowedError"), true);
          if (IS_FRAMED) offerNewTab();
        } else if (code === "network") {
          setNote("Розпізнавання потребує інтернету — без мережі надрукуй текст або диктуй з клавіатури телефона.", true);
        } else if (code === "audio-capture") {
          setNote("Браузер не отримав звук з мікрофона. Перевір, чи він не зайнятий іншою програмою і чи вибраний правильний вхід.", true);
        } else if (code === "language-not-supported") {
          setNote("Браузер не знає цієї мови — перемкни УКР / ENG сусідньою кнопкою.", true);
        } else {
          setNote("Не вдалося розпізнати (" + code + "). Спробуй ще раз або диктуй з клавіатури.", true);
        }
        stop();
      };
      rec.onend = function () {
        /* сам обірвався, хоча ми ще пишемо — піднімаємо назад */
        if (recording) { try { rec.start(); } catch (e) { stop(); } }
      };
      try {
        rec.start();
        recording = true;
        btn.classList.add("rec");
        label.textContent = "Зупинити";
        setNote("Говори — текст зʼявляється в полі вище. Аудіо нікуди не зберігається.");
      } catch (e) {
        setNote("Не вдалося увімкнути мікрофон (" + e.name + ").", true);
        stop();
      }
    }

    /* Спершу просимо мікрофон явно: так браузер показує запит і, головне,
       віддає зрозумілу помилку. Сам розпізнавач у рамці часто мовчки
       не стартує, не пояснюючи причини. */
    function start() {
      baseText = textarea.value ? textarea.value.replace(/\s+$/, "") + " " : "";
      if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) {
        startRecognition();
        return;
      }
      setNote("Прошу доступ до мікрофона…");
      navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
        stream.getTracks().forEach(function (t) { t.stop(); });
        startRecognition();
      }).catch(function (e) {
        setNote(micErrorText(e && e.name ? e.name : "UnknownError"), true);
        if (IS_FRAMED) offerNewTab();
        stop();
      });
    }

    btn.addEventListener("click", function () { if (recording) stop(); else start(); });

    wrap.appendChild(btn);
    wrap.appendChild(langBtn);

    /* причесати надиктоване — розділові знаки та абзаци */
    if (sampleFn) {
      var tidy = el("button", "micbtn", "Причесати");
      tidy.type = "button";
      tidy.addEventListener("click", function () {
        var raw = textarea.value.trim();
        if (!raw) { textarea.focus(); return; }
        tidy.disabled = true;
        var was = tidy.textContent;
        tidy.textContent = "Обробляю…";
        sampleFn("Це надиктована нотатка з виставки. Розстав розділові знаки, виправ очевидні помилки розпізнавання й розбий на речення. Нічого не додавай і не прибирай по суті, мову не змінюй. Поверни лише виправлений текст:\n\n" + raw,
          { modelTier: "quick" })
          .then(function (r) {
            textarea.value = (r.text || raw).trim();
            tidy.disabled = false;
            tidy.textContent = was;
          })
          .catch(function (e) {
            tidy.disabled = false;
            tidy.textContent = was;
            if (e && e.code === "not_granted") tidy.classList.add("hidden");
            else setNote("Не вдалося причесати текст — запиши як є.", true);
          });
      });
      wrap.appendChild(tidy);
    }

    /* Діагностика: коли не працює, треба знати чому, а не гадати. */
    var diag = el("button", "difflink", "Перевірити мікрофон");
    diag.type = "button";
    diag.addEventListener("click", function () { runMicCheck(note); });
    wrap.appendChild(diag);

    wrap.appendChild(note);
    wrap.appendChild(tip);
    return wrap;
  }

  /* Звіт про те, що саме заважає: його можна прочитати або переслати. */
  function runMicCheck(note) {
    note.classList.remove("err");
    note.textContent = "Перевіряю…";
    var lines = [];
    lines.push("Сторінка у вбудованому вікні: " + (IS_FRAMED ? "так" : "ні"));
    lines.push("Захищене зʼєднання: " + (window.isSecureContext ? "так" : "ні"));
    lines.push("Розпізнавання мови в браузері: " + (SR ? "є" : "немає"));
    lines.push("Доступ до мікрофона в API: " +
      (navigator.mediaDevices && navigator.mediaDevices.getUserMedia ? "є" : "немає"));

    function finish(extra) {
      note.textContent = lines.concat(extra || []).join("\n") + "\n" +
        (IS_FRAMED ? "Висновок: відкрий апку окремою вкладкою або диктуй з клавіатури телефона."
                   : "Висновок: якщо доступ дано, а диктування мовчить — перевір інтернет.");
      note.style.whiteSpace = "pre-wrap";
    }
    if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) { finish(); return; }

    var perm = Promise.resolve("невідомо");
    if (navigator.permissions && navigator.permissions.query) {
      perm = navigator.permissions.query({ name: "microphone" })
        .then(function (s) { return s.state; })
        .catch(function () { return "невідомо"; });
    }
    perm.then(function (state) {
      lines.push("Дозвіл на мікрофон: " + state);
      return navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
        stream.getTracks().forEach(function (t) { t.stop(); });
        finish(["Мікрофон відкрився — диктування має працювати."]);
      }).catch(function (e) {
        note.classList.add("err");
        finish(["Мікрофон не відкрився: " + (e && e.name)]);
      });
    });
  }

  function pushSheet(node) {
    sheetStack.push(node);
    document.body.appendChild(node);
    document.body.style.overflow = "hidden";
    try { history.pushState({ sr: sheetStack.length }, ""); } catch (e) {}
  }
  function replaceSheet(node) {
    var old = sheetStack[sheetStack.length - 1];
    if (!old) { pushSheet(node); return; }
    old.replaceWith(node);
    sheetStack[sheetStack.length - 1] = node;
  }
  function popSheet(fromHistory) {
    if (!sheetStack.length) return;
    if (fromHistory !== true) {
      /* Знімає екран сама історія — інакше вкладений екран забирає з собою
         батьківський: ми зняли б вузол тут, а popstate зняв би ще один. */
      try { history.back(); return; } catch (e) { /* історія недоступна — знімаємо вручну */ }
    }
    var node = sheetStack.pop();
    if (node) node.remove();
    if (!sheetStack.length) document.body.style.overflow = "";
  }
  window.addEventListener("popstate", function () { if (sheetStack.length) popSheet(true); });

  /* ================= записи по ліду ================= */
  function blankTouch() { return { status: "", summary: "", meetAt: "", playbook: "", screening: null, log: [], by: "", at: "" }; }
  function getTouch(id) {
    var t = state.touch[id];
    if (!t) return blankTouch();
    if (!t.log) t.log = [];
    /* міграція зі старої версії, де була одна нотатка */
    if (t.note) {
      t.log.push({ id: "m" + hash(t.note), at: t.at || nowISO(), by: t.by || "", text: t.note });
      delete t.note;
    }
    return t;
  }
  function saveTouch(id, t) {
    if (!t.status && !t.summary && !t.meetAt && !t.playbook && !t.screening && (!t.log || !t.log.length)) {
      delete state.touch[id];
      persistTouch();
      if (db) db.doc("touch/" + id).delete().catch(function () {});
      refresh();
      return;
    }
    t.by = state.me || t.by || "";
    t.at = nowISO();
    state.touch[id] = t;
    persistTouch();
    if (db) {
      db.doc("touch/" + id).set(t).catch(function (e) {
        if (e && e.code === "quota_exceeded") toast("Спільна база заповнена — запис лишився лише тут.");
      });
    }
    refresh();
  }
  function setTouch(id, patch, quiet) {
    var t = getTouch(id);
    if (patch.status !== undefined) t.status = patch.status;
    if (patch.summary !== undefined) t.summary = patch.summary;
    if (patch.meetAt !== undefined) t.meetAt = patch.meetAt;
    if (patch.playbook !== undefined) t.playbook = patch.playbook;
    if (patch.screening !== undefined) t.screening = patch.screening;
    var before = JSON.stringify(state.touch[id] || null);
    saveTouch(id, t);
    if (quiet && before === JSON.stringify(state.touch[id] || null)) return;
  }
  function addLogEntry(id, text) {
    var t = getTouch(id);
    t.log.push({ id: hash(text + nowISO() + Math.random()), at: nowISO(), by: state.me || "", text: text });
    saveTouch(id, t);
  }
  function updateLogEntry(id, entryId, text) {
    var t = getTouch(id);
    if (!text) t.log = t.log.filter(function (e) { return e.id !== entryId; });
    else t.log.forEach(function (e) { if (e.id === entryId) { e.text = text; e.editedAt = nowISO(); } });
    saveTouch(id, t);
  }
  function touchedRows() {
    return state.rows.filter(function (r) {
      var t = state.touch[r.__id];
      return t && (t.status || t.summary || t.meetAt || t.screening || (t.log && t.log.length));
    });
  }

  /* ================= збереження ================= */
  function persistBase() {
    var ok = lsSet(LS_BASE, {
      columns: state.columns, map: state.map, alt: state.alt, rows: stripRows(state.rows),
      version: state.baseVersion, label: state.baseLabel
    });
    if (!ok) toast("Базу не вдалось зберегти офлайн — забагато даних для пам'яті браузера.");
  }
  function persistTouch() { lsSet(LS_TOUCH, state.touch); }
  function saveBrief() {
    lsSet(LS_BRIEF, state.brief);
    if (db) db.doc("config/brief").set(state.brief).catch(function () {});
  }
  function stripRows(rows) {
    return rows.map(function (r) {
      var o = {}, k;
      for (k in r) {
        if (k.indexOf("__") !== 0 || k === "__source" || k === "__mkey") o[k] = r[k];
      }
      return o;
    });
  }

  /* ================= імпорт ================= */
  function handleFiles(files) {
    var list = Array.prototype.slice.call(files);
    if (!list.length) return;
    toast("Читаю " + list.length + (list.length === 1 ? " файл…" : " файли…"));
    Promise.all(list.map(readFile)).then(function (all) {
      var parts = [];
      all.forEach(function (p) { parts = parts.concat(p); });
      parts = parts.filter(function (p) { return p && p.rows.length; });
      if (!parts.length) { toast("У файлі не знайшлося рядків з даними."); return; }

      var cols = state.columns.slice();
      parts.forEach(function (p) {
        p.columns.forEach(function (c) { if (cols.indexOf(c) === -1) cols.push(c); });
        state.rows = state.rows.concat(p.rows);
      });
      state.columns = cols;
      var merged = mergeMap(state.map, state.alt, cols);
      state.map = merged.map;
      state.alt = merged.alt;
      state.baseVersion = Date.now();
      reindex();
      persistBase();
      pushBaseToDb();
      resetFilters();
      toast("Завантажено " + parts.reduce(function (a, p) { return a + p.rows.length; }, 0) + " записів");
    }).catch(function (e) {
      toast(e && e.message ? e.message : "Не вдалося прочитати файл.");
    });
  }
  function removeSource(src) {
    state.rows = state.rows.filter(function (r) { return (r.__source || "База") !== src; });
    state.baseVersion = Date.now();
    reindex(); persistBase(); pushBaseToDb(); refresh();
    toast("Джерело прибрано");
  }
  function wipeNotes() {
    var ids = Object.keys(state.touch);
    state.touch = {};
    persistTouch();
    if (db) ids.forEach(function (id) { db.doc("touch/" + id).delete().catch(function () {}); });
    refresh();
    toast("Записи стерто");
  }
  function wipeAll() {
    wipeNotes();
    state.rows = []; state.columns = []; state.map = {}; state.alt = {};
    state.baseVersion = Date.now(); state.baseLabel = "";
    lsDel(LS_BASE);
    reindex();
    if (db) db.doc("base/meta").set({ version: state.baseVersion, chunks: 0, columns: [], map: {}, wiped: true }).catch(function () {});
    resetFilters();
    toast("Стерто");
  }

  /* ================= експорт ================= */
  function csvCell(v) {
    var s = String(v == null ? "" : v);
    return /[",;\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }
  function buildCSV() {
    var head = ["Результат", "Головне по ліду", "Зустріч (фікс)", "Вердикт", "Тип клієнта",
      "Маршрути", "Гіпотези", "Що надсилаємо", "Пообіцяли", "Фолоу-ап надіслано", "Наступне вікно",
      "Відповіді скринінгу", "Журнал", "Записів", "Хто", "Оновлено"].concat(state.columns);
    var lines = [head.map(csvCell).join(",")];
    touchedRows().forEach(function (r) {
      var t = state.touch[r.__id] || {};
      var log = (t.log || []).slice().sort(function (a, b) { return a.at < b.at ? -1 : 1; })
        .map(function (e) { return shortTime(e.at) + (e.by ? " (" + e.by + ")" : "") + ": " + e.text; })
        .join("\n");
      var em = effMeet(r);
      var sc = t.screening || {};
      var scAnswers = Object.keys(sc.answers || {}).map(function (k) {
        return k + ": " + (sc.answers[k].value === true ? "yes" :
          sc.answers[k].value === false ? "no" : sc.answers[k].value);
      }).join("\n");
      var line = [STATUS_LABEL[t.status] || "", t.summary || "",
        em && em.fixed ? em.label : "",
        sc.verdict || "",
        sc.clientType || "",
        (sc.routes || []).join(" + "),
        (sc.hypotheses || []).join(" "),
        (sc.followUp || []).join("; "),
        sc.promised || "",
        sc.followUpSent ? "так" : "",
        sc.nextDate || "",
        scAnswers,
        log,
        String((t.log || []).length), t.by || "", t.at ? shortTime(t.at) : ""];
      state.columns.forEach(function (c) { line.push(r[c] || ""); });
      lines.push(line.map(csvCell).join(","));
    });
    return "﻿" + lines.join("\r\n");
  }
  function copyCSV() {
    var csv = buildCSV();
    var done = function () { toast("CSV у буфері — встав в Excel або Google Таблиці"); };
    function fallbackCopy() {
      var ta = document.createElement("textarea");
      ta.value = csv;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); done(); }
      catch (e) { toast("Скопіювати не вийшло — спробуй «Зберегти файл»."); }
      ta.remove();
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(csv).then(done).catch(fallbackCopy);
    } else fallbackCopy();
  }
  function saveCSV() {
    if (!downloads) return;
    downloads.save({
      filename: "stand-radar-" + new Date().toISOString().slice(0, 10) + ".csv",
      data: buildCSV()
    }).then(function () { toast("Файл збережено"); })
      .catch(function () { toast("Збереження скасовано"); });
  }

  /* ================= синхронізація ================= */
  function chunkRows(rows) {
    var chunks = [], cur = [], len = 0, i, s;
    for (i = 0; i < rows.length; i++) {
      s = JSON.stringify(rows[i]);
      if (len + s.length > CHUNK_CHARS && cur.length) { chunks.push(cur); cur = []; len = 0; }
      cur.push(rows[i]); len += s.length + 1;
    }
    if (cur.length) chunks.push(cur);
    return chunks;
  }
  function pushBaseToDb() {
    if (!db || !state.rows.length) return;
    var chunks = chunkRows(stripRows(state.rows));
    Promise.all(chunks.map(function (c, i) {
      return db.doc("base/chunk" + i).set({ rows: c, v: state.baseVersion });
    })).then(function () {
      return db.doc("base/meta").set({
        version: state.baseVersion, chunks: chunks.length,
        columns: state.columns, map: state.map, alt: state.alt,
        label: state.baseLabel, count: state.rows.length
      });
    }).catch(function (e) {
      if (e && e.code === "quota_exceeded") toast("Спільна база переповнена — тут працює, у команди ні.");
    });
  }
  function pullBaseFromDb(meta) {
    if (!meta || !meta.chunks) return;
    var gets = [], i;
    for (i = 0; i < meta.chunks; i++) gets.push(db.doc("base/chunk" + i).get());
    Promise.all(gets).then(function (snaps) {
      var rows = [];
      snaps.forEach(function (s) {
        var d = s.exists ? s.data() : null;
        if (d && d.rows) rows = rows.concat(d.rows);
      });
      if (!rows.length) return;
      state.rows = rows;
      state.columns = meta.columns || state.columns;
      state.map = meta.map || autoMap(state.columns);
      state.alt = meta.alt || {};
      state.baseVersion = meta.version || Date.now();
      state.baseLabel = meta.label || state.baseLabel;
      reindex();
      persistBase();
      refresh();
      toast("Отримано базу від команди — " + rows.length + " записів");
    }).catch(function () {});
  }
  function initCapabilities() {
    if (!(window.claude && typeof window.claude.use === "function")) return;

    window.claude.use("downloads").then(function (d) { downloads = d; }).catch(function () {});
    window.claude.use("sample").then(function (s) { if (typeof s === "function") sampleFn = s; }).catch(function () {});

    window.claude.use("db").then(function (d) {
      if (!d) return;
      db = d;
      db.doc("base/meta").onSnapshot(function (snap) {
        if (!snap.exists) { pushBaseToDb(); return; }
        var meta = snap.data() || {};
        if (meta.wiped && !meta.chunks) return;
        if ((meta.version || 0) > state.baseVersion) pullBaseFromDb(meta);
        else if (state.rows.length && (meta.version || 0) < state.baseVersion) pushBaseToDb();
      }, function () {});

      db.doc("config/brief").onSnapshot(function (snap) {
        if (!snap.exists) return;
        var d = snap.data() || {};
        if (d.flyby) state.brief.flyby = d.flyby;
        if (d.itout) state.brief.itout = d.itout;
        lsSet(LS_BRIEF, state.brief);
      }, function () {});

      db.collection("touch").onSnapshot(function (snap) {
        var changed = false;
        snap.docChanges().forEach(function (ch) {
          var id = ch.doc.id;
          if (ch.type === "removed") {
            if (state.touch[id]) { delete state.touch[id]; changed = true; }
            return;
          }
          var remote = ch.doc.data() || {}, local = state.touch[id];
          if (!local || !local.at || (remote.at && remote.at > local.at)) {
            state.touch[id] = {
              status: remote.status || "", summary: remote.summary || "",
              meetAt: remote.meetAt || "", playbook: remote.playbook || "",
              screening: remote.screening || null,
              log: Array.isArray(remote.log) ? remote.log : [],
              by: remote.by || "", at: remote.at || ""
            };
            changed = true;
          }
        });
        if (changed) { persistTouch(); refresh(); }
      }, function () {});
    }).catch(function () {});
  }

  /* ================= старт ================= */
  function embedded() {
    var node = document.getElementById("base-data");
    if (!node) return null;
    try { return JSON.parse(node.textContent); } catch (e) { return null; }
  }
  function boot() {
    state.me = lsGet(LS_ME) || "";
    state.touch = lsGet(LS_TOUCH) || {};
    var savedBrief = lsGet(LS_BRIEF) || {};
    state.brief = {
      flyby: savedBrief.flyby || BRIEF_DEFAULT.flyby,
      itout: savedBrief.itout || BRIEF_DEFAULT.itout
    };

    var saved = lsGet(LS_BASE), packed = embedded();
    /* вшита база — те, з чим апка приїхала; збережена перемагає, якщо новіша */
    if (saved && saved.rows && saved.rows.length && (!packed || (saved.version || 0) >= packed.version)) {
      state.columns = saved.columns || [];
      state.map = saved.map || autoMap(state.columns);
      state.alt = saved.alt || {};
      state.rows = saved.rows;
      state.baseVersion = saved.version || 0;
      state.baseLabel = saved.label || "";
    } else if (packed) {
      state.columns = packed.columns;
      state.map = packed.map;
      state.alt = {};
      state.rows = packed.rows;
      state.baseVersion = packed.version;
      state.baseLabel = packed.label || "";
      persistBase();
    }
    reindex();
    refresh();
    initCapabilities();
  }
  function refresh() {
    renderChips();
    renderList();
  }
  /* «Через 25 хв» має лишатися правдою, поки телефон лежить у кишені */
  setInterval(function () { if (!sheetStack.length) renderTimeline(currentRows()); }, 60000);

  /* ================= події ================= */
  var qInput = $("q"), qTimer = null;
  qInput.addEventListener("input", function () {
    $("clearq").classList.toggle("show", !!qInput.value);
    clearTimeout(qTimer);
    qTimer = setTimeout(function () {
      state.filters.q = qInput.value;
      state.limit = 60;
      renderList();
    }, 110);
  });
  qInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      e.preventDefault();
      qInput.blur();
      var first = document.querySelector(".row");
      if (first && norm(qInput.value)) first.click();
    }
  });
  $("clearq").addEventListener("click", function () {
    qInput.value = "";
    state.filters.q = "";
    $("clearq").classList.remove("show");
    renderList();
    qInput.focus();
  });
  $("numToggle").addEventListener("click", function () {
    state.numMode = !state.numMode;
    this.classList.toggle("on", state.numMode);
    qInput.setAttribute("inputmode", state.numMode ? "numeric" : "text");
    qInput.placeholder = state.numMode ? "Номер стенда…" : "Компанія, стенд, людина…";
    qInput.focus();
  });
  $("agendaBtn").addEventListener("click", openAgenda);
  $("filterBtn").addEventListener("click", openFilters);
  $("menuBtn").addEventListener("click", openMenu);
  $("fileInput").addEventListener("change", function () {
    handleFiles(this.files);
    this.value = "";
  });
  ["dragover", "drop"].forEach(function (ev) {
    window.addEventListener(ev, function (e) {
      e.preventDefault();
      if (ev === "drop" && e.dataTransfer && e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
    });
  });

  boot();
})();
</script>
