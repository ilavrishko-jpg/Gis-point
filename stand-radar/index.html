<title>Стенд-радар</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#F1F4F1;
  --surface:#FFFFFF;
  --surface-2:#E6ECE8;
  --surface-3:#DBE4DF;
  --line:#CFDAD4;
  --line-soft:#E2E9E5;
  --text:#12211D;
  --text-dim:#5C6E68;
  --text-faint:#8798924D;
  --accent:#0E7C6B;
  --accent-ink:#08554A;
  --accent-soft:#D8EDE7;
  --hot:#C2410C;
  --hot-soft:#FBE4D8;
  --warn:#A2620A;
  --warn-soft:#F7E9D2;
  --dead:#7A8A85;
  --dead-soft:#E4E9E7;
  --shadow:0 1px 2px rgba(18,33,29,.06),0 8px 24px -12px rgba(18,33,29,.18);
  --shadow-lift:0 2px 6px rgba(18,33,29,.10),0 20px 44px -16px rgba(18,33,29,.30);
  --r:10px;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --disp:"Archivo","IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C1614;
    --surface:#132220;
    --surface-2:#1B2E2A;
    --surface-3:#243B36;
    --line:#2B423C;
    --line-soft:#1F332E;
    --text:#E8EFEB;
    --text-dim:#93A8A1;
    --text-faint:#6B807A;
    --accent:#35B79F;
    --accent-ink:#7FD8C6;
    --accent-soft:#123630;
    --hot:#F97316;
    --hot-soft:#3A2013;
    --warn:#D9962F;
    --warn-soft:#33260F;
    --dead:#7E918B;
    --dead-soft:#1D2C29;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
    --shadow-lift:0 2px 6px rgba(0,0,0,.5),0 20px 44px -16px rgba(0,0,0,.75);
  }
}
:root[data-theme="dark"]{
  --bg:#0C1614;
  --surface:#132220;
  --surface-2:#1B2E2A;
  --surface-3:#243B36;
  --line:#2B423C;
  --line-soft:#1F332E;
  --text:#E8EFEB;
  --text-dim:#93A8A1;
  --text-faint:#6B807A;
  --accent:#35B79F;
  --accent-ink:#7FD8C6;
  --accent-soft:#123630;
  --hot:#F97316;
  --hot-soft:#3A2013;
  --warn:#D9962F;
  --warn-soft:#33260F;
  --dead:#7E918B;
  --dead-soft:#1D2C29;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
  --shadow-lift:0 2px 6px rgba(0,0,0,.5),0 20px 44px -16px rgba(0,0,0,.75);
}

*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:var(--sans);font-size:15px;line-height:1.45;
  -webkit-text-size-adjust:100%;
  overscroll-behavior-y:none;
}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
a{color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}

.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{
  font-family:var(--disp);font-size:10.5px;font-weight:600;
  letter-spacing:.13em;text-transform:uppercase;color:var(--text-dim);
}

/* ---------- shell ---------- */
.shell{max-width:920px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}

.topbar{
  position:sticky;top:0;z-index:40;
  background:var(--bg);
  border-bottom:1px solid var(--line-soft);
}
.topbar-inner{max-width:920px;margin:0 auto;padding:10px 14px 8px}
.brandrow{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.brand{
  font-family:var(--disp);font-weight:700;font-size:17px;letter-spacing:-.01em;
  display:flex;align-items:baseline;gap:7px;
}
.brand .dot{
  width:7px;height:7px;border-radius:50%;background:var(--accent);
  display:inline-block;flex:none;transform:translateY(-1px);
}
.brand-sub{
  font-family:var(--mono);font-size:11px;color:var(--text-dim);
  letter-spacing:.02em;
}
.spacer{flex:1}
.iconbtn{
  width:38px;height:38px;border-radius:var(--r);
  display:grid;place-items:center;color:var(--text-dim);
  border:1px solid transparent;
}
.iconbtn:hover{background:var(--surface-2);color:var(--text)}
.iconbtn.on{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--accent-soft)}
.iconbtn svg{width:19px;height:19px;display:block}

.searchwrap{display:flex;gap:8px;align-items:stretch}
.searchfield{
  flex:1;position:relative;display:flex;align-items:center;
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);box-shadow:var(--shadow);
  transition:border-color .12s ease;
}
.searchfield:focus-within{border-color:var(--accent)}
.searchfield svg{width:18px;height:18px;color:var(--text-dim);margin-left:12px;flex:none}
#q{
  flex:1;min-width:0;border:none;background:none;outline:none;
  padding:12px 10px;font-size:16px;font-weight:500;
}
#q::placeholder{color:var(--text-dim);font-weight:400}
.clearq{padding:0 12px;color:var(--text-dim);font-size:20px;line-height:1;display:none}
.clearq.show{display:block}
.numtoggle{
  flex:none;width:48px;border-radius:var(--r);
  border:1px solid var(--line);background:var(--surface);
  font-family:var(--mono);font-size:13px;font-weight:600;color:var(--text-dim);
  box-shadow:var(--shadow);
}
.numtoggle.on{background:var(--accent);border-color:var(--accent);color:#fff}

.chips{
  display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;
  padding:9px 14px 10px;margin:0 -14px -1px;
}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;padding:5px 11px;border-radius:999px;
  border:1px solid var(--line);background:var(--surface);
  font-size:13px;font-weight:500;color:var(--text-dim);
  display:flex;align-items:center;gap:6px;white-space:nowrap;
}
.chip .n{font-family:var(--mono);font-size:11px;color:var(--text-faint)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.on .n{color:rgba(255,255,255,.75)}
.chip.group{border-style:dashed;color:var(--text-dim)}

/* ---------- progress ---------- */
.progress{
  display:flex;align-items:center;gap:10px;
  padding:8px 14px;border-bottom:1px solid var(--line-soft);
  background:var(--surface);
}
.bar{flex:1;height:5px;border-radius:3px;background:var(--surface-3);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar i.talked{background:var(--accent)}
.bar i.hot{background:var(--hot)}
.bar i.later{background:var(--warn)}
.bar i.no{background:var(--dead)}
.progress .lbl{font-family:var(--mono);font-size:11.5px;color:var(--text-dim);flex:none}

/* ---------- list ---------- */
.list{flex:1;padding:0 0 96px}
.row{
  display:grid;
  grid-template-columns:3px 1fr auto;
  align-items:stretch;
  gap:0;
  width:100%;text-align:left;
  border-bottom:1px solid var(--line-soft);
  background:var(--surface);
}
.row:active{background:var(--surface-2)}
.row .stripe{background:var(--line)}
.row.t-a .stripe{background:var(--accent)}
.row.t-b .stripe{background:color-mix(in srgb,var(--accent) 45%,transparent)}
.row .body{padding:11px 8px 11px 13px;min-width:0}
.row .name{
  font-family:var(--disp);font-weight:600;font-size:15.5px;letter-spacing:-.005em;
  line-height:1.25;overflow-wrap:anywhere;
}
.row .meta{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  margin-top:4px;font-size:12.5px;color:var(--text-dim);
}
.standchip{
  font-family:var(--mono);font-size:11.5px;font-weight:600;
  background:var(--surface-3);color:var(--text);
  padding:1px 6px;border-radius:4px;letter-spacing:.01em;
}
.row .side{
  display:flex;flex-direction:column;align-items:flex-end;justify-content:center;
  gap:5px;padding:11px 13px 11px 6px;flex:none;
}
.tierbadge{
  font-family:var(--mono);font-size:10.5px;font-weight:600;
  color:var(--text-dim);letter-spacing:.06em;
}
.sdot{width:9px;height:9px;border-radius:50%;background:var(--surface-3);flex:none}
.sdot.talked{background:var(--accent)}
.sdot.hot{background:var(--hot)}
.sdot.later{background:var(--warn)}
.sdot.no{background:var(--dead)}
.row .hit{
  display:block;margin-top:5px;font-size:12px;color:var(--text-dim);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.row .hit b{color:var(--text);font-weight:600}
mark{background:var(--accent-soft);color:var(--text);border-radius:2px;padding:0 1px}

.more{
  display:block;width:100%;padding:15px;text-align:center;
  font-weight:600;color:var(--accent-ink);background:var(--surface);
  border-bottom:1px solid var(--line-soft);
}
.empty{padding:56px 28px;text-align:center;color:var(--text-dim)}
.empty h3{
  font-family:var(--disp);font-size:17px;color:var(--text);
  margin:0 0 6px;text-wrap:balance;
}
.empty p{margin:0 0 16px;font-size:14px}

/* ---------- demo banner ---------- */
.demobar{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:7px 14px;background:var(--warn-soft);
  border-bottom:1px solid var(--line-soft);
  font-size:12.5px;color:var(--text);
}
.demobar .eyebrow{color:var(--warn)}
.demobar button{font-weight:600;color:var(--accent-ink);text-decoration:underline}

/* ---------- overlay sheets ---------- */
.sheet{
  position:fixed;inset:0;z-index:60;
  background:var(--bg);
  display:flex;flex-direction:column;
  animation:rise .16s ease-out;
}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.sheet-head{
  position:sticky;top:0;z-index:2;
  display:flex;align-items:center;gap:6px;
  padding:8px 8px 8px 4px;
  background:var(--bg);border-bottom:1px solid var(--line-soft);
}
.sheet-title{
  font-family:var(--disp);font-weight:600;font-size:15px;
  flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.sheet-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-inner{max-width:920px;margin:0 auto;padding:0 14px 40px}

/* ---------- detail ---------- */
.lead-head{padding:14px 0 16px;border-bottom:1px solid var(--line-soft)}
.lead-name{
  font-family:var(--disp);font-weight:700;font-size:23px;line-height:1.15;
  letter-spacing:-.015em;margin:0 0 9px;text-wrap:balance;overflow-wrap:anywhere;
}
.lead-facts{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.fact{
  display:flex;align-items:center;gap:5px;
  font-size:12.5px;color:var(--text-dim);
  background:var(--surface);border:1px solid var(--line);
  padding:3px 9px;border-radius:999px;
}
.fact.stand{background:var(--accent-soft);border-color:transparent;color:var(--accent-ink);font-weight:600}
.fact.stand span{font-family:var(--mono)}
.fact.tier{background:var(--surface-3);border-color:transparent;font-weight:600;color:var(--text)}

.sect{padding:16px 0;border-bottom:1px solid var(--line-soft)}
.sect > .eyebrow{display:block;margin-bottom:10px}

.statusgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
@media(min-width:520px){.statusgrid{grid-template-columns:repeat(4,1fr)}}
.sbtn{
  padding:11px 8px;border-radius:var(--r);
  border:1px solid var(--line);background:var(--surface);
  font-weight:600;font-size:13.5px;color:var(--text-dim);
  display:flex;align-items:center;justify-content:center;gap:7px;
  transition:transform .1s ease;
}
.sbtn:active{transform:scale(.97)}
.sbtn .sdot{width:8px;height:8px}
.sbtn.on.talked{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.sbtn.on.hot{background:var(--hot-soft);border-color:var(--hot);color:var(--hot)}
.sbtn.on.later{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.sbtn.on.no{background:var(--dead-soft);border-color:var(--dead);color:var(--text-dim)}

textarea.note{
  width:100%;min-height:96px;resize:vertical;
  border:1px solid var(--line);border-radius:var(--r);
  background:var(--surface);padding:11px 12px;outline:none;
  font-size:15px;line-height:1.5;
}
textarea.note:focus{border-color:var(--accent)}
.notemeta{
  margin-top:7px;font-family:var(--mono);font-size:11px;color:var(--text-faint);
  display:flex;justify-content:space-between;gap:10px;
}

.kv{display:flex;flex-direction:column;gap:0}
.kv-row{
  display:grid;grid-template-columns:minmax(96px,34%) 1fr;
  gap:12px;padding:8px 0;border-bottom:1px solid var(--line-soft);
  font-size:14px;align-items:baseline;
}
.kv-row:last-child{border-bottom:none}
.kv-row dt{color:var(--text-dim);font-size:12.5px;overflow-wrap:anywhere}
.kv-row dd{margin:0;overflow-wrap:anywhere}
.kv-row dd.mono{font-size:13px}

.linkgrid{display:grid;gap:7px}
.linkbtn{
  display:flex;align-items:center;gap:11px;
  padding:11px 13px;border-radius:var(--r);
  border:1px solid var(--line);background:var(--surface);
  text-decoration:none;color:var(--text);box-shadow:var(--shadow);
}
.linkbtn svg{width:17px;height:17px;color:var(--accent);flex:none}
.linkbtn .l{flex:1;min-width:0}
.linkbtn .l small{display:block;font-size:11px;color:var(--text-dim);line-height:1.3}
.linkbtn .l span{
  display:block;font-weight:500;font-size:14px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}

details.raw{margin-top:4px}
details.raw > summary{
  cursor:pointer;list-style:none;padding:10px 0;
  font-family:var(--disp);font-size:10.5px;font-weight:600;
  letter-spacing:.13em;text-transform:uppercase;color:var(--text-dim);
}
details.raw > summary::-webkit-details-marker{display:none}
details.raw > summary::after{content:" ▾";font-family:var(--sans)}
details.raw[open] > summary::after{content:" ▴"}

.hintbox{
  border:1px solid var(--accent-soft);background:var(--accent-soft);
  border-radius:var(--r);padding:12px 13px;font-size:14px;line-height:1.55;
  white-space:pre-wrap;color:var(--text);
}
.hintbox.pending{color:var(--text-dim);font-style:italic}

/* ---------- generic controls ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 16px;border-radius:var(--r);font-weight:600;font-size:14.5px;
  border:1px solid var(--line);background:var(--surface);color:var(--text);
  box-shadow:var(--shadow);
}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.wide{width:100%}
.btn svg{width:17px;height:17px}
.btn[disabled]{opacity:.5;pointer-events:none}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}

.field{display:block;margin-bottom:12px}
.field > span{display:block;margin-bottom:5px;font-size:12.5px;color:var(--text-dim)}
.field input,.field select{
  width:100%;padding:10px 11px;border-radius:var(--r);
  border:1px solid var(--line);background:var(--surface);outline:none;font-size:15px;
}
.field input:focus,.field select:focus{border-color:var(--accent)}

.note-inline{font-size:13px;color:var(--text-dim);line-height:1.5;margin:0 0 14px}
.mapgrid{display:flex;flex-direction:column;gap:9px}
.maprow{display:grid;grid-template-columns:1fr 1fr;gap:9px;align-items:center}
.maprow > span{font-size:13px;color:var(--text-dim)}
.maprow select{
  padding:9px 10px;border-radius:8px;border:1px solid var(--line);
  background:var(--surface);outline:none;font-size:14px;width:100%;
}
.srcrow{
  display:flex;align-items:center;gap:10px;padding:9px 0;
  border-bottom:1px solid var(--line-soft);font-size:13.5px;
}
.srcrow .mono{font-size:12px;color:var(--text-dim);flex:none}
.srcrow .x{color:var(--hot);font-weight:600;font-size:12.5px}

.toast{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
  z-index:90;background:var(--text);color:var(--bg);
  padding:11px 17px;border-radius:999px;font-size:13.5px;font-weight:500;
  box-shadow:var(--shadow-lift);max-width:88vw;text-align:center;
}
.syncdot{
  width:6px;height:6px;border-radius:50%;background:var(--dead);flex:none;
}
.syncdot.live{background:var(--accent)}
.hidden{display:none !important}
</style>

<div class="shell">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brandrow">
        <div class="brand"><span class="dot"></span>Стенд-радар</div>
        <span class="brand-sub" id="countLbl">—</span>
        <span class="spacer"></span>
        <button class="iconbtn" id="filterBtn" aria-label="Фільтри" title="Фільтри">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 6h18M6 12h12M10 18h4"/></svg>
        </button>
        <button class="iconbtn" id="menuBtn" aria-label="Меню" title="База, поля, експорт">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="5" r="1.4" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="12" cy="19" r="1.4" fill="currentColor" stroke="none"/></svg>
        </button>
      </div>
      <div class="searchwrap">
        <label class="searchfield">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
          <input id="q" type="search" autocomplete="off" autocorrect="off" spellcheck="false"
                 enterkeyhint="search" placeholder="Компанія, стенд, людина…" aria-label="Пошук">
          <button class="clearq" id="clearq" aria-label="Очистити">×</button>
        </label>
        <button class="numtoggle" id="numToggle" title="Тільки цифри — для номера стенда">123</button>
      </div>
      <div class="chips" id="quickChips"></div>
    </div>
  </header>

  <div class="demobar hidden" id="demobar">
    <span class="eyebrow">Демо</span>
    <span>Вигадані компанії для показу.</span>
    <button id="demoImport">Завантажити свою базу</button>
  </div>

  <div class="progress" id="progress"></div>
  <main class="list" id="list"></main>
</div>

<input type="file" id="fileInput" accept=".csv,.tsv,.txt,.xlsx,.xls,.xlsm,.ods" multiple class="hidden">

<script>
"use strict";
(function () {
  /* ==================================================================
     Стенд-радар — пошук лідів на виставці.
     Дані живуть у трьох місцях, у порядку надійності:
       1) пам'ять вкладки   — те, що бачить екран
       2) localStorage      — офлайн-копія на цьому телефоні
       3) db (якщо є)       — спільна база стенда, синхронна для команди
     ================================================================== */

  var LS_BASE = "sr.base.v2", LS_TOUCH = "sr.touch.v2", LS_ME = "sr.me", LS_FILT = "sr.filt.v1";
  var CHUNK_CHARS = 140000;

  var STATUSES = [
    { k: "talked", label: "Поговорили" },
    { k: "hot",    label: "Гарячий" },
    { k: "later",  label: "Пізніше" },
    { k: "no",     label: "Не цікаво" }
  ];
  var STATUS_LABEL = { talked: "Поговорили", hot: "Гарячий", later: "Пізніше", no: "Не цікаво" };

  /* Поля, які апка розуміє. Решта колонок з файлу теж зберігається
     і показується в картці — нічого не губиться. */
  var FIELDS = [
    { k: "company", label: "Компанія",  syn: ["companyname","company","компані","компанія","компания","назвакомпанії","назва","фірма","организация","організація","account","firma","unternehmen","exhibitor","nazwa","бренд","brand","org"] },

  function norm(s) {
    return String(s == null ? "" : s)
      .toLowerCase()
      .replace(/ё/g, "е").replace(/[’'`´]/g, "")
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .replace(/\s+/g, " ").trim();
  }
  function keyify(s) { return norm(s).replace(/[^a-z0-9а-яіїєґ]/gi, ""); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {

    });
  }

  function hash(s) {
    var h = 5381, i;
    for (i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0;
    return h.toString(36);
  }

  /* ================= читання файлів ================= */
  function sniffDelimiter(text) {
    var line = text.split(/\r?\n/).slice(0, 5).join("\n");
    var best = ",", bestN = 0;
    [",", ";", "\t", "|"].forEach(function (d) {
      var n = line.split(d).length;
      if (n > bestN) { bestN = n; best = d; }
    });
    return best;
  }
  function parseCSV(text, delim) {
    var d = delim || sniffDelimiter(text);
    var rows = [], row = [], cur = "", q = false, i, c;
    if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
    for (i = 0; i < text.length; i++) {
      c = text[i];
      if (q) {
        if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; }
        else cur += c;
      } else if (c === '"') q = true;
      else if (c === d) { row.push(cur); cur = ""; }
      else if (c === "\n") { row.push(cur); rows.push(row); row = []; cur = ""; }
      else if (c === "\r") { /* skip */ }
      else cur += c;
    }
    if (cur.length || row.length) { row.push(cur); rows.push(row); }
    return rows;
  }
  /* Заголовок не завжди в першому рядку: беремо найзаповненіший
     з перших восьми, віддаючи перевагу ранньому. */
  function findHeader(matrix) {
    var scan = Math.min(8, matrix.length), best = 0, bestN = -1, i, n;
    for (i = 0; i < scan; i++) {
      n = matrix[i].filter(function (c) { return String(c).trim() !== ""; }).length;
      if (n > bestN * 1.15) { bestN = n; best = i; }
    }
    return best;
  }
  function matrixToRows(matrix, sourceName) {
    if (!matrix || !matrix.length) return null;
    var h = findHeader(matrix);
    var headerRaw = matrix[h].map(function (c) { return String(c == null ? "" : c).trim(); });
    var used = {}, header = headerRaw.map(function (name, i) {
      var nm = name || ("Колонка " + (i + 1));
      if (used[nm]) { used[nm]++; nm = nm + " (" + used[nm] + ")"; } else used[nm] = 1;
      return nm;
    });
    var out = [], i, j, r, obj, any;
    for (i = h + 1; i < matrix.length; i++) {
      r = matrix[i]; obj = {}; any = false;
      for (j = 0; j < header.length; j++) {
        var v = r[j] == null ? "" : String(r[j]).trim();
        if (v) any = true;
        obj[header[j]] = v;
      }
      if (any) { obj.__source = sourceName; out.push(obj); }
    }
    return { columns: header, rows: out };
  }
  function readFile(file) {
    return new Promise(function (resolve, reject) {
      var name = file.name.replace(/\.[^.]+$/, "");
      var isText = /\.(csv|tsv|txt)$/i.test(file.name);
      var fr = new FileReader();
      fr.onerror = function () { reject(new Error("Не вдалося прочитати " + file.name)); };
      fr.onload = function () {
        try {
          var parts = [];
          if (isText) {
            var got = matrixToRows(parseCSV(String(fr.result)), name);
            if (got) parts.push(got);
          } else {
            if (typeof XLSX === "undefined") throw new Error("Читалка Excel не завантажилась — спробуй CSV або онови сторінку.");
            var wb = XLSX.read(new Uint8Array(fr.result), { type: "array" });
            wb.SheetNames.forEach(function (sn) {
              var m = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header: 1, raw: false, defval: "" });
              var got = matrixToRows(m, wb.SheetNames.length > 1 ? name + " · " + sn : name);
              if (got && got.rows.length) parts.push(got);
            });
          }
          resolve(parts);
        } catch (e) { reject(e); }
      };
      if (isText) fr.readAsText(file, "utf-8"); else fr.readAsArrayBuffer(file);
    });
  }

  /* ================= автоматичне зіставлення колонок ================= */
  function autoMap(columns) {
    var keys = columns.map(keyify);
    var map = {}, taken = {};
    FIELDS.forEach(function (f) {
      var bestCol = null, bestScore = 0;
      columns.forEach(function (col, i) {
        if (taken[col]) return;
        var k = keys[i], score = 0;
        f.syn.forEach(function (s) {
          var sk = keyify(s);
          if (!sk) return;
          if (k === sk) score = Math.max(score, 1000 + sk.length);
          else if (k.indexOf(sk) === 0) score = Math.max(score, 400 + sk.length);
          else if (k.indexOf(sk) > -1 && sk.length >= 4) score = Math.max(score, 100 + sk.length);
        });
        if (score > bestScore) { bestScore = score; bestCol = col; }
      });
      if (bestCol) { map[f.k] = bestCol; taken[bestCol] = true; }
    });
    /* Без компанії апка марна — беремо першу текстову колонку. */
    if (!map.company) {
      for (var i = 0; i < columns.length; i++) {
        if (!taken[columns[i]]) { map.company = columns[i]; break; }
      }
    }
    return map;
  }

  function val(row, fieldKey) {
    var col = state.map[fieldKey];
    return col && row[col] != null ? String(row[col]).trim() : "";
  }
  function leadIdOf(row) {
    var base = keyify(val(row, "company")) + "_" + keyify(val(row, "stand"));
    var slug = base.replace(/[^a-z0-9_]/g, "").slice(0, 48) || "lead";
    return slug + "-" + hash(val(row, "company") + "|" + val(row, "stand") + "|" + (row.__source || ""));
  }
  function tierOf(row) {
    var t = norm(val(row, "tier"));
    if (!t) return "";
    if (/^(a|a\b|1|high|високий|top|tier ?a|критич)/.test(t)) return "A";
    if (/^(b|2|mid|середн|tier ?b)/.test(t)) return "B";
    if (/^(c|3|low|низьк|tier ?c)/.test(t)) return "C";
    return val(row, "tier").slice(0, 3).toUpperCase();
  }

  /* ================= індексація для пошуку ================= */
  function reindex() {
    state.rows.forEach(function (r) {
      r.__id = leadIdOf(r);
      r.__tier = tierOf(r);
      var bag = [];
      for (var k in r) {
        if (k.indexOf("__") === 0) continue;
        if (r[k]) bag.push(r[k]);
      }
      r.__hay = norm(bag.join(" ⋅ "));
      r.__stand = norm(val(r, "stand"));
      r.__standDigits = val(r, "stand").replace(/\D/g, "");
      r.__company = val(r, "company") || "(без назви)";
      r.__companyN = norm(r.__company);
    });
    state.sources = [];
    var seen = {};
    state.rows.forEach(function (r) {
      var s = r.__source || "База";
      if (!seen[s]) { seen[s] = 1; state.sources.push(s); } else seen[s]++;
    });
    state.sourceCounts = seen;
  }

  function matches(row, tokens, digitsOnly) {
    var i, t;
    if (digitsOnly && tokens.length === 1) {
      /* режим стенда: цифри мають збігатися з номером стенда */
      return row.__standDigits.indexOf(tokens[0]) > -1;
    }
    for (i = 0; i < tokens.length; i++) {
      t = tokens[i];
      if (row.__hay.indexOf(t) === -1) return false;
    }
    return true;
  }

  function currentRows() {
    var f = state.filters;
    var qn = norm(f.q);
    var tokens = qn ? qn.split(" ").filter(Boolean) : [];
    var digitsOnly = tokens.length === 1 && /^\d+$/.test(tokens[0]);
    var out = state.rows.filter(function (r) {
      if (f.country && norm(val(r, "country")) !== f.country) return false;
      if (f.tier && r.__tier !== f.tier) return false;
      if (f.source && (r.__source || "База") !== f.source) return false;
      var st = state.touch[r.__id] && state.touch[r.__id].status;
      if (f.status && st !== f.status) return false;
      if (f.unvisited && st) return false;
      if (tokens.length && !matches(r, tokens, digitsOnly)) return false;
      return true;
    });
    if (tokens.length) {
      out.sort(function (a, b) { return score(b, tokens, digitsOnly) - score(a, tokens, digitsOnly); });
    } else {
      var rank = { A: 0, B: 1, C: 2 };
      out.sort(function (a, b) {
        var ra = rank[a.__tier] != null ? rank[a.__tier] : 3;
        var rb = rank[b.__tier] != null ? rank[b.__tier] : 3;
        if (ra !== rb) return ra - rb;
        return a.__companyN < b.__companyN ? -1 : a.__companyN > b.__companyN ? 1 : 0;
      });
    }
    return out;
  }
  function score(row, tokens, digitsOnly) {
    var s = 0;
    tokens.forEach(function (t) {
      if (row.__companyN.indexOf(t) === 0) s += 60;
      else if (row.__companyN.indexOf(t) > -1) s += 30;
      if (row.__stand.indexOf(t) > -1) s += digitsOnly ? 80 : 25;
      if (row.__hay.indexOf(t) > -1) s += 5;
    });
    if (row.__tier === "A") s += 4; else if (row.__tier === "B") s += 2;
    return s;
  }

  /* ================= рендер списку ================= */
  function highlight(text, tokens) {
    if (!tokens.length) return esc(text);
    var out = esc(text), i;
    for (i = 0; i < tokens.length; i++) {
      if (tokens[i].length < 2) continue;
      var re = new RegExp("(" + tokens[i].replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi");
      out = out.replace(re, "<mark>$1</mark>");
    }
    return out;
  }
  /* Показуємо, ЧОМУ рядок знайшовся, якщо збіг не в назві та не в стенді. */
  function whyLine(row, tokens) {
    if (!tokens.length) return null;
    var t = tokens[0];
    if (row.__companyN.indexOf(t) > -1 || row.__stand.indexOf(t) > -1) return null;
    for (var k in row) {
      if (k.indexOf("__") === 0) continue;
      var v = row[k];
      if (v && norm(v).indexOf(t) > -1) {
        return "<b>" + esc(k) + ":</b> " + highlight(String(v).slice(0, 120), tokens);
      }
    }
    return null;
  }

  function rowNode(r, tokens) {
    var t = state.touch[r.__id];
    var node = el("button", "row" + (r.__tier === "A" ? " t-a" : r.__tier === "B" ? " t-b" : ""));
    node.type = "button";
    node.appendChild(el("div", "stripe"));

    var body = el("div", "body");

    name.innerHTML = highlight(r.__company, tokens);
    body.appendChild(name);

    var meta = el("div", "meta");
    var stand = val(r, "stand");
    if (stand) {
      var sc = el("span", "standchip");
      sc.innerHTML = highlight(stand, tokens);
      meta.appendChild(sc);
    }
    var place = [val(r, "country"), val(r, "city")].filter(Boolean).join(" · ");
    if (place) meta.appendChild(el("span", null, place));
    if (!place && val(r, "segment")) meta.appendChild(el("span", null, val(r, "segment")));
    if (t && t.status) {
      var st = el("span", null, STATUS_LABEL[t.status]);
      st.style.fontWeight = "600";
      meta.appendChild(st);
    }
    body.appendChild(meta);

    var why = whyLine(r, tokens);
    if (why) {
      var w = el("span", "hit");
      w.innerHTML = why;
      body.appendChild(w);
    }
    node.appendChild(body);

    var side = el("div", "side");
    if (t && t.status) side.appendChild(el("span", "sdot " + t.status));
    if (r.__tier) side.appendChild(el("span", "tierbadge", r.__tier));

  function renderProgress() {
    var p = $("progress");
    p.innerHTML = "";
    if (!state.rows.length) { p.classList.add("hidden"); return; }
    p.classList.remove("hidden");
    var counts = { talked: 0, hot: 0, later: 0, no: 0 }, done = 0;
    state.rows.forEach(function (r) {
      var t = state.touch[r.__id];
      if (t && t.status && counts[t.status] != null) { counts[t.status]++; done++; }
    });
    var bar = el("div", "bar");
    ["hot", "talked", "later", "no"].forEach(function (k) {
      if (!counts[k]) return;
      var i = el("i", k);
      i.style.width = (counts[k] / state.rows.length * 100) + "%";
      bar.appendChild(i);
    });
    var lbl = el("span", "lbl", done + " / " + state.rows.length + " опрацьовано");
    if (counts.hot) lbl.textContent += " · " + counts.hot + " гарячих";
    p.appendChild(bar);
    p.appendChild(lbl);
  }

  /* ================= чіпи швидких фільтрів ================= */
  function renderChips() {
    var box = $("quickChips");
    box.innerHTML = "";
    if (!state.rows.length) return;

  /* ================= sheets ================= */
  function sheetHead(title, onBack) {

  function pushSheet(node) {
    sheetStack.push(node);
    document.body.appendChild(node);
    document.body.style.overflow = "hidden";
    try { history.pushState({ sr: sheetStack.length }, ""); } catch (e) {}
  }
  function popSheet(fromHistory) {
    var node = sheetStack.pop();
    if (node) node.remove();
    if (!sheetStack.length) {
      document.body.style.overflow = "";
      openLeadId = null;
    }
    if (!fromHistory) { try { history.back(); } catch (e) {} }
  }
  window.addEventListener("popstate", function () {
    if (sheetStack.length) popSheet(true);
  });

  /* ================= нотатки та статуси ================= */
  function setTouch(id, patch) {
    var t = state.touch[id] || {};
    var next = { status: t.status || "", note: t.note || "", by: t.by || "", at: t.at || "" };
    if (patch.status !== undefined) next.status = patch.status;
    if (patch.note !== undefined) next.note = patch.note;
    if (!next.status && !next.note) {
      delete state.touch[id];
      persistTouch();
      if (db) db.doc("touch/" + id).delete().catch(function () {});
      refresh();
      return;
    }
    next.by = state.me || next.by || "";
    next.at = nowISO();
    state.touch[id] = next;
    persistTouch();
    if (db) {
      db.doc("touch/" + id).set(next).catch(function (e) {
        if (e && e.code === "quota_exceeded") toast("Спільна база заповнена — нотатка збережена лише тут.");
      });
    }
    refresh();
  }
  function touchedRows() {
    return state.rows.filter(function (r) {
      var t = state.touch[r.__id];
      return t && (t.status || t.note);
    });
  }

  /* ================= збереження ================= */
  function persistBase() {
    if (state.isDemo) return;
    var ok = lsSet(LS_BASE, {
      columns: state.columns, map: state.map, rows: stripRows(state.rows), version: state.baseVersion
    });
    if (!ok) toast("Базу не вдалось зберегти офлайн — забагато даних для пам'яті браузера.");
  }
  function persistTouch() { lsSet(LS_TOUCH, state.touch); }
  function stripRows(rows) {
    return rows.map(function (r) {
      var o = {};
      for (var k in r) if (k.indexOf("__") !== 0 || k === "__source") o[k] = r[k];
      return o;
    });
  }

  /* ================= імпорт ================= */
  function handleFiles(files) {
    var list = Array.prototype.slice.call(files);
    if (!list.length) return;
    toast("Читаю " + list.length + (list.length === 1 ? " файл…" : " файли…"));
    Promise.all(list.map(readFile)).then(function (all) {
      var parts = [];
      all.forEach(function (p) { parts = parts.concat(p); });
      parts = parts.filter(function (p) { return p && p.rows.length; });
      if (!parts.length) { toast("У файлі не знайшлося рядків з даними."); return; }

      var wasDemo = state.isDemo;
      if (wasDemo) { state.rows = []; state.columns = []; state.isDemo = false; }

      var cols = state.columns.slice();
      parts.forEach(function (p) {
        p.columns.forEach(function (c) { if (cols.indexOf(c) === -1) cols.push(c); });
        state.rows = state.rows.concat(p.rows);
      });
      state.columns = cols;
      state.map = autoMap(cols);
      state.baseVersion = Date.now();
      reindex();
      persistBase();
      pushBaseToDb();
      resetFilters();
      var n = parts.reduce(function (a, p) { return a + p.rows.length; }, 0);
      toast("Завантажено " + n + " записів");
      $("demobar").classList.add("hidden");
    }).catch(function (e) {
      toast(e && e.message ? e.message : "Не вдалося прочитати файл.");
    });
  }
  function removeSource(src) {
    state.rows = state.rows.filter(function (r) { return (r.__source || "База") !== src; });
    state.baseVersion = Date.now();
    reindex(); persistBase(); pushBaseToDb(); refresh();
    toast("Джерело прибрано");
  }
  function wipeAll() {
    state.rows = []; state.columns = []; state.map = {}; state.touch = {};
    state.isDemo = false; state.baseVersion = Date.now();
    lsDel(LS_BASE); lsDel(LS_TOUCH);
    reindex();
    if (db) {
      db.doc("base/meta").set({ version: state.baseVersion, chunks: 0, columns: [], map: {}, wiped: true }).catch(function () {});
    }
    resetFilters();
    toast("Стерто");
  }

  /* ================= експорт ================= */
  function csvCell(v) {
    var s = String(v == null ? "" : v);
    return /[",;\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }
  function buildCSV() {
    var rows = touchedRows();
    var head = ["Статус", "Моя нотатка", "Хто", "Коли"].concat(state.columns);
    var lines = [head.map(csvCell).join(",")];
    rows.forEach(function (r) {
      var t = state.touch[r.__id] || {};
      var line = [STATUS_LABEL[t.status] || "", t.note || "", t.by || "", t.at ? shortTime(t.at) : ""];
      state.columns.forEach(function (c) { line.push(r[c] || ""); });
      lines.push(line.map(csvCell).join(","));
    });
    return "﻿" + lines.join("\r\n");
  }
  function copyCSV() {
    var csv = buildCSV();
    var done = function () { toast("CSV у буфері — встав у Excel або Google Таблиці"); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(csv).then(done).catch(fallbackCopy);
    } else fallbackCopy();
    function fallbackCopy() {
      var ta = document.createElement("textarea");
      ta.value = csv;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); done(); }
      catch (e) { toast("Скопіювати не вийшло — виділи текст вручну."); }
      ta.remove();
    }
  }
  function saveCSV() {
    if (!downloads) return;
    var name = "stand-radar-" + new Date().toISOString().slice(0, 10) + ".csv";
    downloads.save({ filename: name, data: buildCSV() })
      .then(function () { toast("Файл збережено"); })
      .catch(function () { toast("Збереження скасовано"); });
  }

  /* ================= синхронізація через db ================= */
  function chunkRows(rows) {
    var chunks = [], cur = [], len = 0, i, s;
    for (i = 0; i < rows.length; i++) {
      s = JSON.stringify(rows[i]);
      if (len + s.length > CHUNK_CHARS && cur.length) { chunks.push(cur); cur = []; len = 0; }
      cur.push(rows[i]); len += s.length + 1;
    }
    if (cur.length) chunks.push(cur);
    return chunks;
  }
  function pushBaseToDb() {
    if (!db || state.isDemo) return;
    var chunks = chunkRows(stripRows(state.rows));
    var writes = chunks.map(function (c, i) {
      return db.doc("base/chunk" + i).set({ rows: c, v: state.baseVersion });
    });
    Promise.all(writes).then(function () {
      return db.doc("base/meta").set({
        version: state.baseVersion,
        chunks: chunks.length,
        columns: state.columns,
        map: state.map,
        count: state.rows.length
      });
    }).then(function () {
      toast("База роздана команді");
    }).catch(function (e) {
      if (e && e.code === "quota_exceeded") toast("Спільна база переповнена — тут працює, у команди ні.");
    });
  }
  function pullBaseFromDb(meta) {
    if (!meta || !meta.chunks) return;
    var gets = [], i;
    for (i = 0; i < meta.chunks; i++) gets.push(db.doc("base/chunk" + i).get());
    Promise.all(gets).then(function (snaps) {
      var rows = [];
      snaps.forEach(function (s) {
        var d = s.exists ? s.data() : null;
        if (d && d.rows) rows = rows.concat(d.rows);
      });
      if (!rows.length) return;
      state.rows = rows;
      state.columns = meta.columns || state.columns;
      state.map = meta.map || autoMap(state.columns);
      state.baseVersion = meta.version || Date.now();
      state.isDemo = false;
      reindex();
      persistBase();
      $("demobar").classList.add("hidden");
      refresh();
      toast("Отримано базу від команди — " + rows.length + " записів");
    }).catch(function () {});
  }
  function initDb() {
    if (!(window.claude && typeof window.claude.use === "function")) return;

    window.claude.use("downloads").then(function (d) { downloads = d; }).catch(function () {});
    window.claude.use("sample").then(function (s) { if (typeof s === "function") sampleFn = s; }).catch(function () {});

    window.claude.use("db").then(function (d) {
      if (!d) return;
      db = d;
      var line = $("syncLine");
      if (line) line.textContent = "Нотатки синхронізуються з рештою команди.";

      dbBaseUnsub = db.doc("base/meta").onSnapshot(function (snap) {
        if (!snap.exists) {
          /* сховище порожнє: якщо в нас є справжня база — ділимось нею */
          if (state.rows.length && !state.isDemo) pushBaseToDb();
          return;
        }
        var meta = snap.data() || {};
        if (meta.wiped && !meta.chunks) return;
        if ((meta.version || 0) > state.baseVersion) pullBaseFromDb(meta);
        else if (state.rows.length && !state.isDemo && (meta.version || 0) < state.baseVersion) pushBaseToDb();
      }, function () {});

      db.collection("touch").onSnapshot(function (snap) {
        var changed = false;
        snap.docChanges().forEach(function (ch) {
          var id = ch.doc.id;
          if (ch.type === "removed") {
            if (state.touch[id]) { delete state.touch[id]; changed = true; }
            return;
          }
          var remote = ch.doc.data() || {};
          var local = state.touch[id];
          if (!local || !local.at || (remote.at && remote.at > local.at)) {
            state.touch[id] = { status: remote.status || "", note: remote.note || "", by: remote.by || "", at: remote.at || "" };
            changed = true;
          }
        });
        if (changed) { persistTouch(); refresh(); }
      }, function () {});
    }).catch(function () {});
  }

  /* ================= завантаження стану ================= */
  function boot() {
    state.me = lsGet(LS_ME) || "";
    state.touch = lsGet(LS_TOUCH) || {};
    var saved = lsGet(LS_BASE);
    if (saved && saved.rows && saved.rows.length) {
      state.columns = saved.columns || [];
      state.map = saved.map || autoMap(state.columns);
      state.rows = saved.rows;
      state.baseVersion = saved.version || 0;
      state.isDemo = false;
    } else {
      state.columns = DEMO_COLUMNS.slice();
      state.rows = DEMO_ROWS.map(function (r) {
        var o = {};
        DEMO_COLUMNS.forEach(function (c, i) { o[c] = r[i]; });
        o.__source = "Демо";
        return o;
      });
      state.map = autoMap(state.columns);
      state.isDemo = true;
      $("demobar").classList.remove("hidden");
    }
    reindex();
    refresh();
    initDb();
  }

  function refresh() {
    state.limit = Math.max(60, Math.min(state.limit, 600));
    renderChips();
    renderList();
  }

  /* ================= події ================= */
  var qInput = $("q"), qTimer = null;
  qInput.addEventListener("input", function () {
    $("clearq").classList.toggle("show", !!qInput.value);
    clearTimeout(qTimer);
    qTimer = setTimeout(function () {
      state.filters.q = qInput.value;
      state.limit = 60;
      renderList();
    }, 110);
  });
  qInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      e.preventDefault();
      qInput.blur();
      var first = document.querySelector(".row");
      if (first && norm(qInput.value)) first.click();
    }
  });
  $("clearq").addEventListener("click", function () {
    qInput.value = "";
    state.filters.q = "";
    $("clearq").classList.remove("show");
    renderList();
    qInput.focus();
  });
  $("numToggle").addEventListener("click", function () {
    state.numMode = !state.numMode;
    this.classList.toggle("on", state.numMode);
    qInput.setAttribute("inputmode", state.numMode ? "numeric" : "text");
    qInput.placeholder = state.numMode ? "Номер стенда…" : "Компанія, стенд, людина…";
    qInput.focus();
  });
  $("filterBtn").addEventListener("click", openFilters);
  $("menuBtn").addEventListener("click", openMenu);
  $("demoImport").addEventListener("click", function () { $("fileInput").click(); });
  $("fileInput").addEventListener("change", function () {
    handleFiles(this.files);
    this.value = "";
  });

  /* перетягування файлу на десктопі */
  ["dragover", "drop"].forEach(function (ev) {
    window.addEventListener(ev, function (e) {
      e.preventDefault();
      if (ev === "drop" && e.dataTransfer && e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
    });
  });

  boot();
})();
</script>
