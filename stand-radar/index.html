<title>Стенд-радар</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Manrope:wght@400;500;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#EFF6F1;
  --surface:#FFFFFF;
  --surface-2:#E4EFE7;
  --surface-3:#D7E6DC;
  --line:#C8DCCF;
  --line-soft:#DFEBE3;
  --text:#0F261B;
  --text-dim:#53705F;
  --text-faint:#8AA394;
  --accent:#124D38;
  --accent-ink:#0D3A2A;
  --accent-soft:#D8EBDE;
  --hot:#A9401A;
  --hot-soft:#F8E3D8;
  --warn:#8A6516;
  --warn-soft:#F4E9D0;
  --dead:#75897E;
  --dead-soft:#E3EBE6;
  --shadow:0 1px 2px rgba(18,33,29,.06),0 8px 24px -12px rgba(18,33,29,.18);
  --shadow-lift:0 2px 6px rgba(18,33,29,.10),0 20px 44px -16px rgba(18,33,29,.30);
  --r:12px;
  --sans:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --disp:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0A1711;
    --surface:#102019;
    --surface-2:#182C22;
    --surface-3:#20382C;
    --line:#284535;
    --line-soft:#1B3126;
    --text:#E7F0EA;
    --text-dim:#93AB9C;
    --text-faint:#6D857A;
    --accent:#43A87F;
    --accent-ink:#86D5B0;
    --accent-soft:#123326;
    --hot:#E0762F;
    --hot-soft:#361D11;
    --warn:#CE9A3B;
    --warn-soft:#2F2510;
    --dead:#7E9187;
    --dead-soft:#1C2B24;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
    --shadow-lift:0 2px 6px rgba(0,0,0,.5),0 20px 44px -16px rgba(0,0,0,.75);
  }
}
:root[data-theme="dark"]{
  --bg:#0A1711;
  --surface:#102019;
  --surface-2:#182C22;
  --surface-3:#20382C;
  --line:#284535;
  --line-soft:#1B3126;
  --text:#E7F0EA;
  --text-dim:#93AB9C;
  --text-faint:#6D857A;
  --accent:#43A87F;
  --accent-ink:#86D5B0;
  --accent-soft:#123326;
  --hot:#E0762F;
  --hot-soft:#361D11;
  --warn:#CE9A3B;
  --warn-soft:#2F2510;
  --dead:#7E9187;
  --dead-soft:#1C2B24;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
  --shadow-lift:0 2px 6px rgba(0,0,0,.5),0 20px 44px -16px rgba(0,0,0,.75);
}

*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg) url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='320' height='320' viewBox='0 0 320 320'><g fill='none' stroke='%23124D38' stroke-width='1.1' opacity='0.08'><path d='M-40 250C40 210 90 250 150 210S270 150 360 190'/><path d='M-40 210C40 170 90 210 150 170S270 110 360 150'/><path d='M-40 170C40 130 90 170 150 130S270 70 360 110'/><path d='M-40 130C40 90 90 130 150 90S270 30 360 70'/><path d='M-40 90C40 50 90 90 150 50S270 -10 360 30'/><path d='M-40 290C40 250 90 290 150 250S270 190 360 230'/></g></svg>") repeat;
  background-attachment:fixed;
  color:var(--text);
  font-family:var(--sans);font-size:15px;line-height:1.45;
  -webkit-text-size-adjust:100%;
  overscroll-behavior-y:none;
}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
a{color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}

@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) body,
  :root:not([data-theme="light"]) .topbar{background-blend-mode:screen}
}
:root[data-theme="dark"] body,
:root[data-theme="dark"] .topbar{background-blend-mode:screen}

.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{
  font-family:var(--disp);font-size:10.5px;font-weight:600;
  letter-spacing:.13em;text-transform:uppercase;color:var(--text-dim);
}

/* ---------- shell ---------- */
.shell{max-width:920px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}

.topbar{
  position:sticky;top:0;z-index:40;
  /* та сама фіксована прив'язка, що й у body — рельєф лишається суцільним,
     хоч шапка й накриває сторінку при скролі */
  background:var(--bg) url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='320' height='320' viewBox='0 0 320 320'><g fill='none' stroke='%23124D38' stroke-width='1.1' opacity='0.08'><path d='M-40 250C40 210 90 250 150 210S270 150 360 190'/><path d='M-40 210C40 170 90 210 150 170S270 110 360 150'/><path d='M-40 170C40 130 90 170 150 130S270 70 360 110'/><path d='M-40 130C40 90 90 130 150 90S270 30 360 70'/><path d='M-40 90C40 50 90 90 150 50S270 -10 360 30'/><path d='M-40 290C40 250 90 290 150 250S270 190 360 230'/></g></svg>") repeat fixed;
  border-bottom:1px solid var(--line-soft);
}
.topbar-inner{max-width:920px;margin:0 auto;padding:10px 14px 8px}
.brandrow{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.brand{
  font-family:var(--disp);font-weight:800;font-size:17px;letter-spacing:-.025em;
  display:flex;align-items:baseline;gap:7px;
}
.brand .dot{
  width:7px;height:7px;border-radius:50%;background:var(--accent);
  display:inline-block;flex:none;transform:translateY(-1px);
}
.brand-sub{
  font-family:var(--mono);font-size:11px;color:var(--text-dim);
  letter-spacing:.02em;
}
.spacer{flex:1}
.iconbtn{
  width:38px;height:38px;border-radius:var(--r);
  display:grid;place-items:center;color:var(--text-dim);
  border:1px solid transparent;
}
.iconbtn:hover{background:var(--surface-2);color:var(--text)}
.iconbtn.on{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--accent-soft)}
.iconbtn svg{width:19px;height:19px;display:block}

.searchwrap{display:flex;gap:8px;align-items:stretch}
.searchfield{
  flex:1;position:relative;display:flex;align-items:center;
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);box-shadow:var(--shadow);
  transition:border-color .12s ease;
}
.searchfield:focus-within{border-color:var(--accent)}
.searchfield svg{width:18px;height:18px;color:var(--text-dim);margin-left:12px;flex:none}
#q{
  flex:1;min-width:0;border:none;background:none;outline:none;
  padding:12px 10px;font-size:16px;font-weight:500;
}
#q::placeholder{color:var(--text-dim);font-weight:400}
.clearq{padding:0 12px;color:var(--text-dim);font-size:20px;line-height:1;display:none}
.clearq.show{display:block}
.numtoggle{
  flex:none;width:48px;border-radius:var(--r);
  border:1px solid var(--line);background:var(--surface);
  font-family:var(--mono);font-size:13px;font-weight:600;color:var(--text-dim);
  box-shadow:var(--shadow);
}
.numtoggle.on{background:var(--accent);border-color:var(--accent);color:#fff}

.chips{
  display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;
  padding:9px 14px 10px;margin:0 -14px -1px;
}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;padding:6px 13px;border-radius:999px;
  border:1px solid var(--line);background:var(--surface);
  font-size:13px;font-weight:600;color:var(--text-dim);
  display:flex;align-items:center;gap:6px;white-space:nowrap;
}
.chip .n{font-family:var(--mono);font-size:11px;color:var(--text-faint)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.on .n{color:rgba(255,255,255,.75)}
.chip.group{border-style:dashed;color:var(--text-dim)}

/* ---------- progress ---------- */
.progress{
  display:flex;align-items:center;gap:10px;
  padding:8px 14px;border-bottom:1px solid var(--line-soft);
  background:var(--surface);
}
.bar{flex:1;height:5px;border-radius:3px;background:var(--surface-3);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar i.talked{background:var(--accent)}
.bar i.hot{background:var(--hot)}
.bar i.later{background:var(--warn)}
.bar i.no{background:var(--dead)}
.progress .lbl{font-family:var(--mono);font-size:11.5px;color:var(--text-dim);flex:none}

/* ---------- list ---------- */
.list{flex:1;padding:0 0 96px}
.row{
  display:grid;
  grid-template-columns:3px 1fr auto;
  align-items:stretch;
  gap:0;
  width:100%;text-align:left;
  border-bottom:1px solid var(--line-soft);
  background:var(--surface);
}
.row:active{background:var(--surface-2)}
.row .stripe{background:var(--line)}
.row.t-a .stripe{background:var(--accent)}
.row.t-b .stripe{background:color-mix(in srgb,var(--accent) 45%,transparent)}
.row .body{padding:11px 8px 11px 13px;min-width:0}
.row .name{
  font-family:var(--disp);font-weight:700;font-size:15.5px;letter-spacing:-.015em;
  line-height:1.25;overflow-wrap:anywhere;
}
.row .meta{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  margin-top:4px;font-size:12.5px;color:var(--text-dim);
}
.standchip{
  font-family:var(--mono);font-size:11.5px;font-weight:600;
  background:var(--surface-3);color:var(--text);
  padding:1px 6px;border-radius:4px;letter-spacing:.01em;
}
.standchip.unknown{
  font-family:var(--sans);font-weight:400;font-style:italic;
  background:none;color:var(--text-dim);padding:1px 0;
}
.row .side{
  display:flex;flex-direction:column;align-items:flex-end;justify-content:center;
  gap:5px;padding:11px 13px 11px 6px;flex:none;
}
.tierbadge{
  font-family:var(--mono);font-size:10.5px;font-weight:600;
  color:var(--text-dim);letter-spacing:.06em;
}
.sdot{width:9px;height:9px;border-radius:50%;background:var(--surface-3);flex:none}
.sdot.talked{background:var(--accent)}
.sdot.hot{background:var(--hot)}
.sdot.later{background:var(--warn)}
.sdot.no{background:var(--dead)}
.row .hit{
  display:block;margin-top:5px;font-size:12px;color:var(--text-dim);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.row .hit b{color:var(--text);font-weight:600}
mark{background:var(--accent-soft);color:var(--text);border-radius:2px;padding:0 1px}

.more{
  display:block;width:100%;padding:15px;text-align:center;
  font-weight:600;color:var(--accent-ink);background:var(--surface);
  border-bottom:1px solid var(--line-soft);
}
.empty{padding:56px 28px;text-align:center;color:var(--text-dim)}
.empty h3{
  font-family:var(--disp);font-size:18px;font-weight:800;letter-spacing:-.02em;color:var(--text);
  margin:0 0 6px;text-wrap:balance;
}
.empty p{margin:0 0 16px;font-size:14px}

/* ---------- overlay sheets ---------- */
.sheet{
  position:fixed;inset:0;z-index:60;
  background:var(--bg);
  display:flex;flex-direction:column;
  animation:rise .16s ease-out;
}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.sheet-head{
  position:sticky;top:0;z-index:2;
  display:flex;align-items:center;gap:6px;
  padding:8px 8px 8px 4px;
  background:var(--bg);border-bottom:1px solid var(--line-soft);
}
.sheet-title{
  font-family:var(--disp);font-weight:600;font-size:15px;
  flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.sheet-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-inner{max-width:920px;margin:0 auto;padding:0 14px 40px}

/* ---------- detail ---------- */
.lead-head{padding:14px 0 16px;border-bottom:1px solid var(--line-soft)}
.lead-name{
  font-family:var(--disp);font-weight:800;font-size:24px;line-height:1.12;
  letter-spacing:-.03em;margin:0 0 9px;text-wrap:balance;overflow-wrap:anywhere;
}
.lead-facts{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.fact{
  display:flex;align-items:center;gap:5px;
  font-size:12.5px;color:var(--text-dim);
  background:var(--surface);border:1px solid var(--line);
  padding:3px 9px;border-radius:999px;
}
.fact.stand{background:var(--accent-soft);border-color:transparent;color:var(--accent-ink);font-weight:600}
.fact.stand span{font-family:var(--mono)}
.fact.tier{background:var(--surface-3);border-color:transparent;font-weight:600;color:var(--text)}

.sect{padding:16px 0;border-bottom:1px solid var(--line-soft)}
.sect > .eyebrow{display:block;margin-bottom:10px}

.statusgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
@media(min-width:520px){.statusgrid{grid-template-columns:repeat(4,1fr)}}
.sbtn{
  padding:11px 8px;border-radius:var(--r);
  border:1px solid var(--line);background:var(--surface);
  font-weight:600;font-size:13.5px;color:var(--text-dim);
  display:flex;align-items:center;justify-content:center;gap:7px;
  transition:transform .1s ease;
}
.sbtn:active{transform:scale(.97)}
.sbtn .sdot{width:8px;height:8px}
.sbtn.on.talked{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.sbtn.on.hot{background:var(--hot-soft);border-color:var(--hot);color:var(--hot)}
.sbtn.on.later{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.sbtn.on.no{background:var(--dead-soft);border-color:var(--dead);color:var(--text-dim)}

textarea.note{
  width:100%;min-height:96px;resize:vertical;
  border:1px solid var(--line);border-radius:var(--r);
  background:var(--surface);padding:11px 12px;outline:none;
  font-size:15px;line-height:1.5;
}
textarea.note:focus{border-color:var(--accent)}
.notemeta{
  margin-top:7px;font-family:var(--mono);font-size:11px;color:var(--text-faint);
  display:flex;justify-content:space-between;gap:10px;
}

.kv{display:flex;flex-direction:column;gap:0}
.kv-row{
  display:grid;grid-template-columns:minmax(96px,34%) 1fr;
  gap:12px;padding:8px 0;border-bottom:1px solid var(--line-soft);
  font-size:14px;align-items:baseline;
}
.kv-row:last-child{border-bottom:none}
.kv-row dt{color:var(--text-dim);font-size:12.5px;overflow-wrap:anywhere}
.kv-row dd{margin:0;overflow-wrap:anywhere}
.kv-row dd.mono{font-size:13px}

.linkgrid{display:grid;gap:7px}
.linkbtn{
  display:flex;align-items:center;gap:11px;
  padding:11px 13px;border-radius:var(--r);
  border:1px solid var(--line);background:var(--surface);
  text-decoration:none;color:var(--text);box-shadow:var(--shadow);
}
.linkbtn svg{width:17px;height:17px;color:var(--accent);flex:none}
.linkbtn .l{flex:1;min-width:0}
.linkbtn .l small{display:block;font-size:11px;color:var(--text-dim);line-height:1.3}
.linkbtn .l span{
  display:block;font-weight:500;font-size:14px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}

details.raw{margin-top:4px}
details.raw > summary{
  cursor:pointer;list-style:none;padding:10px 0;
  font-family:var(--disp);font-size:10.5px;font-weight:600;
  letter-spacing:.13em;text-transform:uppercase;color:var(--text-dim);
}
details.raw > summary::-webkit-details-marker{display:none}
details.raw > summary::after{content:" ▾";font-family:var(--sans)}
details.raw[open] > summary::after{content:" ▴"}

.hintbox{
  border:1px solid var(--accent-soft);background:var(--accent-soft);
  border-radius:var(--r);padding:12px 13px;font-size:14px;line-height:1.55;
  white-space:pre-wrap;color:var(--text);
}
.hintbox.pending{color:var(--text-dim);font-style:italic}

/* ---------- generic controls ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:13px 18px;border-radius:var(--r);font-weight:700;font-size:14.5px;
  letter-spacing:-.005em;
  border:1px solid var(--line);background:var(--surface);color:var(--text);
  box-shadow:var(--shadow);
}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.wide{width:100%}
.btn svg{width:17px;height:17px}
.btn[disabled]{opacity:.5;pointer-events:none}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}

.field{display:block;margin-bottom:12px}
.field > span{display:block;margin-bottom:5px;font-size:12.5px;color:var(--text-dim)}
.field input,.field select{
  width:100%;padding:10px 11px;border-radius:var(--r);
  border:1px solid var(--line);background:var(--surface);outline:none;font-size:15px;
}
.field input:focus,.field select:focus{border-color:var(--accent)}

.note-inline{font-size:13px;color:var(--text-dim);line-height:1.5;margin:0 0 14px}
.mapgrid{display:flex;flex-direction:column;gap:9px}
.maprow{display:grid;grid-template-columns:1fr 1fr;gap:9px;align-items:center}
.maprow > span{font-size:13px;color:var(--text-dim)}
.maprow select{
  padding:9px 10px;border-radius:8px;border:1px solid var(--line);
  background:var(--surface);outline:none;font-size:14px;width:100%;
}
.srcrow{
  display:flex;align-items:center;gap:10px;padding:9px 0;
  border-bottom:1px solid var(--line-soft);font-size:13.5px;
}
.srcrow .mono{font-size:12px;color:var(--text-dim);flex:none}
.srcrow .x{color:var(--hot);font-weight:600;font-size:12.5px}

.toast{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
  pointer-events:none;
  z-index:90;background:var(--text);color:var(--bg);
  padding:11px 17px;border-radius:999px;font-size:13.5px;font-weight:500;
  box-shadow:var(--shadow-lift);max-width:88vw;text-align:center;
}
.syncdot{
  width:6px;height:6px;border-radius:50%;background:var(--dead);flex:none;
}
.syncdot.live{background:var(--accent)}

/* --- статус із бази: не мій результат, а стадія до виставки --- */
.pbadge{
  font-size:11px;font-weight:600;letter-spacing:.01em;
  padding:1.5px 7px;border-radius:999px;white-space:nowrap;
  background:var(--surface-3);color:var(--text-dim);
}
.pbadge.p-meet{background:var(--accent);color:#fff}
.pbadge.p-warm{background:var(--accent-soft);color:var(--accent-ink)}
.pbadge.p-need{background:var(--warn-soft);color:var(--warn)}
.pbadge.p-no{background:var(--dead-soft);color:var(--text-dim)}
.meetchip{
  font-family:var(--mono);font-size:11.5px;font-weight:600;
  color:var(--accent-ink);background:var(--accent-soft);
  padding:1px 6px;border-radius:4px;
}
.iconbtn{position:relative}
.badge{
  position:absolute;top:-1px;right:-3px;min-width:15px;height:15px;padding:0 4px;
  border-radius:999px;background:var(--accent);color:#fff;
  font-family:var(--mono);font-size:9.5px;font-weight:600;line-height:15px;text-align:center;border:1.5px solid var(--bg);
}
.badge:empty{display:none}

/* --- головне по ліду, видно просто зі списку --- */
.row .summary{
  display:block;margin-top:5px;font-size:12.5px;line-height:1.4;color:var(--text);
  border-left:2px solid var(--accent);padding-left:8px;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
}
input.summary-in,input.meet-in{
  width:100%;padding:11px 12px;border-radius:var(--r);
  border:1px solid var(--line);background:var(--surface);outline:none;font-size:15px;
}
input.summary-in:focus,input.meet-in:focus{border-color:var(--accent)}

/* --- журнал зустрічей --- */
.logadd{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.logitem{
  border-left:2px solid var(--line);padding:0 0 14px 12px;position:relative;
}
.logitem:last-child{padding-bottom:0}
.logitem::before{
  content:"";position:absolute;left:-5px;top:5px;width:8px;height:8px;
  border-radius:50%;background:var(--accent);border:2px solid var(--bg);
}
.logitem .when{
  font-family:var(--mono);font-size:11px;color:var(--text-dim);
  display:flex;gap:8px;align-items:center;flex-wrap:wrap;
}
.logitem .txt{margin-top:3px;font-size:14.5px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.logitem .acts{display:flex;gap:12px;margin-top:5px}
.logitem .acts button{font-size:11.5px;font-weight:600;color:var(--text-dim)}
.logitem .acts button:hover{color:var(--accent-ink)}
.logempty{font-size:13.5px;color:var(--text-dim);line-height:1.5}

/* --- розклад --- */
.slot{
  display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-soft);
  width:100%;text-align:left;align-items:flex-start;
}
.slot .time{
  font-family:var(--mono);font-size:13px;font-weight:600;color:var(--accent-ink);
  flex:none;width:66px;padding-top:1px;
}
.slot .who{flex:1;min-width:0}
.slot .who .nm{font-family:var(--disp);font-weight:600;font-size:15px;line-height:1.25}
.slot .who .sub{margin-top:3px;font-size:12.5px;color:var(--text-dim);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.daysep{
  padding:14px 0 6px;font-family:var(--disp);font-size:11px;font-weight:600;
  letter-spacing:.13em;text-transform:uppercase;color:var(--text-dim);
}

/* --- смуга фіксованих годин: тільки ті, у кого є конкретний час --- */
.timeline{
  background:var(--surface);border-bottom:1px solid var(--line-soft);
  padding:8px 0 10px;
}
.tl-head{padding:0 14px 6px}
.tl-cards{
  display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:0 14px;
}
.tl-cards::-webkit-scrollbar{display:none}
.tcard{
  flex:none;width:138px;text-align:left;
  border:1px solid var(--line);border-radius:var(--r);
  background:var(--bg);padding:7px 9px 8px;
}
.tcard .t{
  font-family:var(--mono);font-size:16px;font-weight:600;
  color:var(--text);line-height:1.15;
}
.tcard .c{
  font-family:var(--disp);font-weight:600;font-size:12.5px;margin-top:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.tcard .s{
  font-size:11px;color:var(--text-dim);margin-top:1px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.tcard .when{
  display:block;margin-top:4px;font-size:10px;font-weight:600;
  letter-spacing:.09em;text-transform:uppercase;color:var(--text-dim);
}
.tcard.next{border-color:var(--accent);background:var(--accent-soft)}
.tcard.next .t,.tcard.next .when{color:var(--accent-ink)}
.tcard.now{border-color:var(--hot);background:var(--hot-soft)}
.tcard.now .t,.tcard.now .when{color:var(--hot)}
.tcard.now .when::before{
  content:"";display:inline-block;width:6px;height:6px;border-radius:50%;
  background:var(--hot);margin-right:5px;vertical-align:1px;
  animation:blip 1.6s ease-in-out infinite;
}
@keyframes blip{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.tcard.now .when::before{animation:none}}
.tcard.past{opacity:.45}
.tcard.past .t{text-decoration:line-through}
.tcard .sdot{display:inline-block;margin-left:5px;vertical-align:1px}

/* година в рядку списку читається інакше, ніж просто дата */
.meetchip.fixed{background:var(--accent);color:#fff}

/* --- диктування --- */
.logtools{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.micbtn{
  display:inline-flex;align-items:center;gap:7px;
  padding:9px 13px;border-radius:var(--r);font-weight:600;font-size:13.5px;
  border:1px solid var(--line);background:var(--surface);color:var(--text);
}
.micbtn svg{width:16px;height:16px;color:var(--accent)}
.micbtn.rec{background:var(--hot);border-color:var(--hot);color:#fff}
.micbtn.rec svg{color:#fff}
.micbtn.rec::after{
  content:"";width:7px;height:7px;border-radius:50%;background:#fff;
  animation:blip 1.2s ease-in-out infinite;
}
.langbtn{
  padding:9px 11px;border-radius:var(--r);border:1px solid var(--line);
  background:var(--surface);font-family:var(--mono);font-size:12px;font-weight:600;
  color:var(--text-dim);
}
.micnote{margin:8px 0 0;font-size:12.5px;color:var(--text-dim);line-height:1.5}
.difflink{

}
.difflink:hover{color:var(--accent-ink)}
.opentab{width:100%}
.micnote.err{color:var(--hot)}


/* --- сценарій розмови --- */
.pb-head{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.pb-switch{display:flex;gap:6px;margin-bottom:10px}

  flex:1;padding:8px 10px;border-radius:var(--r);

}

details.pb-group{border-bottom:1px solid var(--line-soft)}

details.pb-group > summary{

.pb-list{margin:0 0 10px;padding:0 0 0 18px;display:flex;flex-direction:column;gap:7px}
.pb-list li{font-size:14px;line-height:1.5;color:var(--text-prose,var(--text))}

textarea.brief{

/* --- скринінг --- */
.type-list{display:flex;flex-direction:column;gap:8px}

      throw new Error("Набір для " + clientTypeId + " має бути 3–5 питань, а не " + qs.length);
    }
    return qs;
  }

  function monthsAhead(n) {
    var d = new Date();
    d.setHours(0, 0, 0, 0);
    d.setMonth(d.getMonth() + n);
    return d;
  }

  /* Чи відповідь проходить passWhen цього питання. */
  function passes(q, answer) {
    if (!answer) return false;
    var v = answer.value;
    switch (q.answerType) {
      case "number":
        var n = typeof v === "number" ? v : parseFloat(String(v).replace(/[^\d.\-]/g, ""));
        return isFinite(n) && n >= q.min;
      case "single":
        return !!q.pass && q.pass.indexOf(v) > -1;
      case "boolean":
        return v === true;
      case "date":
        if (!v) return false;
        var d = new Date(v);
        if (isNaN(d.getTime())) return false;
        if (!q.withinMonths) return true;      /* потрібна просто конкретна дата */
        var today = new Date();
        today.setHours(0, 0, 0, 0);
        return d >= today && d <= monthsAhead(q.withinMonths);
      case "text":
        if (!v || !String(v).trim()) return false;
        return q.passFlag ? answer.flag === true : true;
      default:
        return false;
    }
  }

  function isDisqualified(q, answer) {
    if (!q.isDisqualifier || !answer) return false;
    return (q.disqualifyValues || []).indexOf(answer.value) > -1;
  }

  /* Скоринг: кожна гіпотеза зараховується один раз. */
  function score(clientTypeId, answers, opts) {
    opts = opts || {};
    var t = typeById(clientTypeId);
    var qs = getQuestionsFor(clientTypeId);
    var confirmed = {}, disqualifier = null, geoFilterFailed = false, hot = [];

    qs.forEach(function (q) {
      var a = answers[q.id];
      if (isDisqualified(q, a)) {
        disqualifier = { questionId: q.id, value: a.value, suggestType: q.suggestType || null };
        return;
      }
      var ok = passes(q, a);
      if (q.isGeoFilter && a && !ok) geoFilterFailed = true;
      if (!ok) return;
      if (q.hypothesis) confirmed[q.hypothesis] = true;
      if (q.hotValues && a && q.hotValues.indexOf(a.value) > -1) hot.push(q.id);
    });

    if (opts.paidPilot === true) confirmed.H6 = true;

    var list = HYPOTHESES.map(function (h) { return h[0]; })
      .filter(function (k) { return confirmed[k]; });

    var routes = [];
    if (t && t.route) routes.push(t.route);
    if (opts.crossSellDone && routes.indexOf(CROSS_SELL.route) === -1) routes.push(CROSS_SELL.route);

    return {
      clientType: clientTypeId,
      hypotheses: list,
      count: list.length,
      disqualifier: disqualifier,
      geoFilterFailed: geoFilterFailed,
      hotSignals: hot,
      routes: routes,
      verdict: verdictOf(list.length, !!disqualifier),
      followUp: followUpFor(routes, !!disqualifier)
    };
  }

  function verdictOf(count, disqualified) {
    if (disqualified) return "STOP";
    if (count >= 6) return "HOT";
    if (count >= 4) return "LEAD";
    return "CONTACT";
  }

  var VERDICTS = {
    HOT: { label: "HOT", note: "Ставити зустріч одразу." },
    LEAD: { label: "LEAD", note: "Фолоу-ап протягом 24 годин." },
    CONTACT: { label: "CONTACT", note: "Просто контакт, фолоу-ап низького пріоритету." },
    STOP: { label: "STOP", note: "Спрацював дискваліфікатор — далі не йдемо." }
  };

  function followUpFor(routes, disqualified) {
    if (disqualified) return [ROUTES.X.followUp];
    return (routes || []).map(function (r) { return ROUTES[r] ? ROUTES[r].followUp : ""; })
      .filter(Boolean);
  }

  return {
    HYPOTHESES: HYPOTHESES,
    ROUTES: ROUTES,
    VERDICTS: VERDICTS,
    CLIENT_TYPES: CLIENT_TYPES,
    CROSS_SELL: CROSS_SELL,
    EXIT_LINES: EXIT_LINES,
    H6_QUESTION: H6_QUESTION,
    typeById: typeById,
    getQuestionsFor: getQuestionsFor,
    passes: passes,
    isDisqualified: isDisqualified,
    score: score,
    verdictOf: verdictOf,
    followUpFor: followUpFor
  };
})();
</script>

<script>
"use strict";
(function () {
  /* ==================================================================
     Стенд-радар — пошук лідів на виставці.

     Два незалежні виміри статусу, які легко сплутати:
       «Статус» з бази   — стадія до виставки (зустріч, зацікавлені, …)
       «Результат»       — що сталося на стенді, ставить користувач

     Дані живуть у трьох місцях, у порядку надійності:
       1) пам'ять вкладки — те, що бачить екран
       2) localStorage    — офлайн-копія на цьому телефоні
       3) db (якщо є)     — спільна база стенда, синхронна для команди
     ================================================================== */

  var LS_BASE = "sr.base.v2", LS_TOUCH = "sr.touch.v2", LS_ME = "sr.me", LS_BRIEF = "sr.brief.v1";
  var CHUNK_CHARS = 140000;

  var STATUSES = [
    { k: "talked", label: "Поговорили" },
    { k: "hot",    label: "Гарячий" },
    { k: "later",  label: "Пізніше" },
    { k: "no",     label: "Не цікаво" }
  ];
  var STATUS_LABEL = { talked: "Поговорили", hot: "Гарячий", later: "Пізніше", no: "Не цікаво" };

  /* Поля, які апка розуміє. Решта колонок з файлу теж зберігається
     і показується в картці — нічого не губиться. */
  var FIELDS = [
    { k: "company", label: "Компанія",  syn: ["companyname","company","компані","компанія","назва","фірма","организація","організація","account","firma","unternehmen","exhibitor","nazwa","бренд","brand","org"] },
    { k: "stand",   label: "Стенд",     syn: ["standnumber","boothnumber","standno","stand","booth","стенд","номерстенда","hall","зал","павільйон","павильон","stoisko","standnummer","halle","місце"] },
    { k: "pstatus", label: "Статус з бази", syn: ["статус","status","стадія","стадия","етап","stage","pipeline","воронка"] },
    { k: "meet",    label: "Час зустрічі", syn: ["зустріч","часзустрічі","датазустрічі","meeting","meetingtime","appointment","слот","встреча"] },
    { k: "country", label: "Країна",    syn: ["country","країна","страна","land","kraj","countryname","hqcountry"] },
    { k: "city",    label: "Місто",     syn: ["city","місто","город","stadt","miasto","town","hqcity"] },
    { k: "person",  label: "Контакт",   syn: ["contactperson","fullname","contactname","decisionmaker","лпр","контактн","контакт","особа","ім'я","имя","person","ansprechpartner","firstname","name","osoba"] },
    { k: "role",    label: "Посада",    syn: ["jobtitle","title","position","посада","роль","function","stanowisko","seniority"] },
    { k: "email",   label: "Email",     syn: ["email","emailaddress","e-mail","mail","пошта","емейл","почта"] },
    { k: "phone",   label: "Телефон",   syn: ["phonenumber","phone","tel","telefon","телефон","мобільний","mobile","whatsapp"] },
    { k: "website", label: "Сайт / LinkedIn", syn: ["linkedinurl","linkedin","website","websiteurl","site","url","сайт","домен","domain","web","link"] },
    { k: "tier",    label: "Пріоритет", syn: ["tier","priority","пріорит","пріоритет","приоритет","рівень","grade","категорія","клас","score","рейтинг","abc"] },
    { k: "segment", label: "Сегмент",   syn: ["segment","сегмент","industry","галуз","галузь","індустрі","напрям","вертикаль","niche","ніша","category","branche"] },
    { k: "offer",   label: "Гачок / що пропонуємо", syn: ["гачок","hook","offer","офер","оффер","пропон","пропоз","пропозиція","цінність","рішення","solution","value","product","продукт","service","послуга","nextstep","наступнийкрок","action","дія","pitch","зачіпка","angle","usecase","кейс"] },
    { k: "note",    label: "Довідка з бази", syn: ["збагачення","enrichment","notes","note","нотат","приміт","коментар","комент","comment","опис","description","insight","інсайт","signal","сигнал","контекст","research"] }
  ];

  /* класи статусу з бази -> колір бейджа */
  function pstatusClass(v) {
    var n = norm(v);
    if (!n) return "";
    if (n.indexOf("зустріч") > -1 && n.indexOf("не ") === -1) return "p-meet";
    if (n.indexOf("зацікав") > -1 || n.indexOf("інтерес") > -1 || n.indexOf("warm") > -1) return "p-warm";
    if (n.indexOf("потреб") > -1 || n.indexOf("виявити") > -1) return "p-need";
    if (n.indexOf("відмов") > -1 || n.indexOf("не цікав") > -1 || n.indexOf("lost") > -1) return "p-no";
    return "";
  }

  /* ================= стан ================= */
  var state = {
    columns: [], map: {}, alt: {}, rows: [], sources: [], sourceCounts: {},
    touch: {}, me: "", baseVersion: 0, baseLabel: "", brief: null,
    filters: { q: "", country: null, tier: null, status: null, pstatus: null, source: null, unvisited: false },
    numMode: false, limit: 60
  };
  var db = null, sampleFn = null, downloads = null;
  var sheetStack = [];

  /* ================= утиліти ================= */
  function $(id) { return document.getElementById(id); }
  function el(tag, cls, txt) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (txt != null) n.textContent = txt;
    return n;
  }
  function norm(s) {
    return String(s == null ? "" : s)
      .toLowerCase()
      .replace(/ё/g, "е").replace(/[’'`´]/g, "")
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .replace(/\s+/g, " ").trim();
  }
  function keyify(s) { return norm(s).replace(/[^a-z0-9а-яіїєґ]/gi, ""); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }
  function nowISO() { return new Date().toISOString(); }
  function hash(s) {
    var h = 5381, i;
    for (i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0;
    return h.toString(36);
  }
  function lsGet(k) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
  function shortTime(iso) {
    try {
      return new Date(iso).toLocaleString("uk-UA", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
    } catch (e) { return iso; }
  }

  var toastTimer = null;
  function toast(msg) {
    var t = document.querySelector(".toast");
    if (t) t.remove();
    t = el("div", "toast", msg);
    document.body.appendChild(t);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { if (t.parentNode) t.remove(); }, 2600);
  }

  /* ================= читання файлів ================= */
  function sniffDelimiter(text) {
    var line = text.split(/\r?\n/).slice(0, 5).join("\n"), best = ",", bestN = 0;
    [",", ";", "\t", "|"].forEach(function (d) {
      var n = line.split(d).length;
      if (n > bestN) { bestN = n; best = d; }
    });
    return best;
  }
  function parseCSV(text, delim) {
    var d = delim || sniffDelimiter(text);
    var rows = [], row = [], cur = "", q = false, i, c;
    if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
    for (i = 0; i < text.length; i++) {
      c = text[i];
      if (q) {
        if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; }
        else cur += c;
      } else if (c === '"') q = true;
      else if (c === d) { row.push(cur); cur = ""; }
      else if (c === "\n") { row.push(cur); rows.push(row); row = []; cur = ""; }
      else if (c === "\r") { /* пропускаємо */ }
      else cur += c;
    }
    if (cur.length || row.length) { row.push(cur); rows.push(row); }
    return rows;
  }
  /* Заголовок не завжди в першому рядку: беремо найзаповненіший
     з перших восьми, віддаючи перевагу ранньому. */
  function findHeader(matrix) {
    var scan = Math.min(8, matrix.length), best = 0, bestN = -1, i, n;
    for (i = 0; i < scan; i++) {
      n = matrix[i].filter(function (c) { return String(c).trim() !== ""; }).length;
      if (n > bestN * 1.15) { bestN = n; best = i; }
    }
    return best;
  }
  function matrixToRows(matrix, sourceName) {
    if (!matrix || !matrix.length) return null;
    var h = findHeader(matrix);
    var headerRaw = matrix[h].map(function (c) { return String(c == null ? "" : c).trim(); });
    var used = {}, header = headerRaw.map(function (name, i) {
      var nm = name || ("Колонка " + (i + 1));
      if (used[nm]) { used[nm]++; nm = nm + " (" + used[nm] + ")"; } else used[nm] = 1;
      return nm;
    });
    var out = [], i, j, r, obj, any, v;
    for (i = h + 1; i < matrix.length; i++) {
      r = matrix[i]; obj = {}; any = false;
      for (j = 0; j < header.length; j++) {
        v = r[j] == null ? "" : String(r[j]).trim();
        if (v) any = true;
        obj[header[j]] = v;
      }
      if (any) { obj.__source = sourceName; out.push(obj); }
    }
    return { columns: header, rows: out };
  }
  function readFile(file) {
    return new Promise(function (resolve, reject) {
      var name = file.name.replace(/\.[^.]+$/, "");
      var isText = /\.(csv|tsv|txt)$/i.test(file.name);
      var fr = new FileReader();
      fr.onerror = function () { reject(new Error("Не вдалося прочитати " + file.name)); };
      fr.onload = function () {
        try {
          var parts = [], got;
          if (isText) {
            got = matrixToRows(parseCSV(String(fr.result)), name);
            if (got) parts.push(got);
          } else {
            if (typeof XLSX === "undefined") throw new Error("Читалка Excel не завантажилась — спробуй CSV або онови сторінку.");
            var wb = XLSX.read(new Uint8Array(fr.result), { type: "array" });
            wb.SheetNames.forEach(function (sn) {
              var m = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header: 1, raw: false, defval: "" });
              var g = matrixToRows(m, wb.SheetNames.length > 1 ? name + " · " + sn : name);
              if (g && g.rows.length) parts.push(g);
            });
          }
          resolve(parts);
        } catch (e) { reject(e); }
      };
      if (isText) fr.readAsText(file, "utf-8"); else fr.readAsArrayBuffer(file);
    });
  }

  /* ================= зіставлення колонок ================= */
  function autoMap(columns) {
    var keys = columns.map(keyify), map = {}, taken = {}, i;
    FIELDS.forEach(function (f) {
      var bestCol = null, bestScore = 0;
      columns.forEach(function (col, ci) {
        if (taken[col]) return;
        var k = keys[ci], score = 0;
        f.syn.forEach(function (syn) {
          var sk = keyify(syn);
          if (!sk) return;
          if (k === sk) score = Math.max(score, 1000 + sk.length);
          else if (k.indexOf(sk) === 0) score = Math.max(score, 400 + sk.length);
          else if (k.indexOf(sk) > -1 && sk.length >= 4) score = Math.max(score, 100 + sk.length);
        });
        if (score > bestScore) { bestScore = score; bestCol = col; }
      });
      if (bestCol) { map[f.k] = bestCol; taken[bestCol] = true; }
    });
    if (!map.company) {
      for (i = 0; i < columns.length; i++) {
        if (!taken[columns[i]]) { map.company = columns[i]; break; }
      }
    }
    return map;
  }

  /* Імпорт нового файлу не має переставляти вже зіставлені поля:
     колонка «Контакт» зі стороннього файлу колись перехоплювала роль «Ім'я»,
     через що мінялися ідентифікатори лідів і відв'язувалися всі нотатки.
     Тож зберігаємо чинне зіставлення й добираємо лише з вільних колонок. */
  function mergeMap(existing, existingAlt, columns) {
    var map = {}, alt = {}, taken = {};
    FIELDS.forEach(function (f) {
      var col = existing && existing[f.k];
      if (col && columns.indexOf(col) > -1) { map[f.k] = col; taken[col] = true; }
      (existingAlt && existingAlt[f.k] || []).forEach(function (c) {
        if (columns.indexOf(c) > -1 && !taken[c]) {
          (alt[f.k] = alt[f.k] || []).push(c);
          taken[c] = true;
        }
      });
    });
    var free = columns.filter(function (c) { return !taken[c]; });
    var added = autoMap(free);
    FIELDS.forEach(function (f) {
      if (!added[f.k]) return;
      /* роль уже зайнята — нова колонка стає запасною, а не забирає її */
      if (map[f.k]) (alt[f.k] = alt[f.k] || []).push(added[f.k]);
      else map[f.k] = added[f.k];
    });
    return { map: map, alt: alt };
  }

  function val(row, fieldKey) {
    var col = state.map[fieldKey], v;
    if (col && row[col] != null) {
      v = String(row[col]).trim();
      if (v) return v;
    }
    var alts = state.alt[fieldKey] || [], i;
    for (i = 0; i < alts.length; i++) {
      if (row[alts[i]] != null) {
        v = String(row[alts[i]]).trim();
        if (v) return v;
      }
    }
    return "";
  }
  /* Ідентифікатор ліда має бути стабільним між перезаливками бази й водночас
     різним для двох людей з однієї компанії — навіть якщо колонки з іменем
     немає взагалі. Тому в хеш іде ще й пошта та профіль. */
  function leadIdOf(row) {
    var base = keyify(val(row, "company")) + "_" + keyify(val(row, "person"));
    var slug = base.replace(/[^a-z0-9_]/g, "").slice(0, 48) || "lead";
    return slug + "-" + hash([val(row, "company"), val(row, "person"), val(row, "stand"),
      val(row, "email"), val(row, "website"), row.__source || ""].join("|"));
  }
  /* Схема до появи пошти в хеші — щоб нотатки, зроблені раніше, не загубились. */
  function legacyIdOf(row) {
    var base = keyify(val(row, "company")) + "_" + keyify(val(row, "person"));
    var slug = base.replace(/[^a-z0-9_]/g, "").slice(0, 48) || "lead";
    return slug + "-" + hash(val(row, "company") + "|" + val(row, "person") + "|" + val(row, "stand") + "|" + (row.__source || ""));
  }
  function tierOf(row) {
    var raw = val(row, "tier"), t = norm(raw);
    if (!t) return "";
    if (/^(a|1|high|високий|top)/.test(t)) return "A";
    if (/^(b|2|mid|середн)/.test(t)) return "B";
    if (/^(c|3|low|низьк)/.test(t)) return "C";
    return raw.slice(0, 3).toUpperCase();
  }

  /* Час зустрічі: те, що виставив користувач, головніше за базу.
     Повертає null, якщо зустрічі немає взагалі. */
  function effMeet(row) {
    var t = state.touch[row.__id], d;
    if (t && t.meetAt) {
      d = new Date(t.meetAt);
      if (!isNaN(d.getTime())) return { date: d, fixed: true, label: fmtMeet(d), mine: true };
    }
    if (!row.__meet) return null;
    var hm = row.__meet.match(/(\d{1,2}):(\d{2})/);
    var md = (row.__mkey || "").match(/^(\d{2})(\d{2})/);
    if (hm && md) {
      d = new Date();
      d.setFullYear(d.getFullYear(), parseInt(md[1], 10) - 1, parseInt(md[2], 10));
      d.setHours(parseInt(hm[1], 10), parseInt(hm[2], 10), 0, 0);
      return { date: d, fixed: true, label: row.__meet, mine: false };
    }
    return { date: null, fixed: false, label: row.__meet, mine: false };
  }
  var MON = ["січ","лют","бер","кві","тра","чер","лип","сер","вер","жов","лис","гру"];
  function fmtMeet(d) {
    return d.getDate() + " " + MON[d.getMonth()] + ", " +
      String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  }
  /* Наскільки зустріч близько — це і є «світиться» у смузі. */
  function meetState(d, now) {
    var min = (d - now) / 60000;
    if (min < -25) return { cls: "past", text: "минула" };
    if (min <= 20) return { cls: "now", text: "зараз" };
    if (min <= 90) return { cls: "next", text: "через " + Math.round(min) + " хв" };
    if (d.toDateString() === now.toDateString()) return { cls: "", text: "сьогодні" };
    return { cls: "", text: MON[d.getMonth()] ? d.getDate() + " " + MON[d.getMonth()] : "" };
  }
  function toLocalInput(d) {
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" +
      String(d.getDate()).padStart(2, "0") + "T" + String(d.getHours()).padStart(2, "0") +
      ":" + String(d.getMinutes()).padStart(2, "0");
  }

  /* ================= індексація ================= */
  function reindex() {
    var moved = 0;
    state.rows.forEach(function (r) {
      r.__id = leadIdOf(r);
      var old = legacyIdOf(r);
      if (old !== r.__id && state.touch[old] && !state.touch[r.__id]) {
        state.touch[r.__id] = state.touch[old];
        delete state.touch[old];
        moved++;
        if (db) {
          db.doc("touch/" + r.__id).set(state.touch[r.__id]).catch(function () {});
          db.doc("touch/" + old).delete().catch(function () {});
        }
      }
      r.__tier = tierOf(r);
      r.__company = val(r, "company") || val(r, "person") || "(без назви)";
      r.__companyN = norm(r.__company);
      r.__stand = norm(val(r, "stand"));
      r.__standDigits = val(r, "stand").replace(/\D/g, "");
      r.__pstatus = val(r, "pstatus");
      r.__meet = val(r, "meet");
      if (!r.__mkey) r.__mkey = r.__meet ? "0000 " + (r.__meet.match(/\d{1,2}:\d{2}/) || ["99:99"])[0] : "9";
      var bag = [];
      for (var k in r) {
        if (k.indexOf("__") === 0) continue;
        if (r[k]) bag.push(r[k]);
      }
      r.__hay = norm(bag.join(" ⋅ "));
    });
    if (moved) persistTouch();
    state.sources = [];
    var seen = {};
    state.rows.forEach(function (r) {
      var s = r.__source || "База";
      if (!seen[s]) { seen[s] = 1; state.sources.push(s); } else seen[s]++;
    });
    state.sourceCounts = seen;
  }

  function matches(row, tokens, digitsOnly) {
    if (digitsOnly && tokens.length === 1) return row.__standDigits.indexOf(tokens[0]) > -1;
    for (var i = 0; i < tokens.length; i++) if (row.__hay.indexOf(tokens[i]) === -1) return false;
    return true;
  }
  function score(row, tokens, digitsOnly) {
    var s = 0;
    tokens.forEach(function (t) {
      if (row.__companyN.indexOf(t) === 0) s += 60;
      else if (row.__companyN.indexOf(t) > -1) s += 30;
      if (row.__stand.indexOf(t) > -1) s += digitsOnly ? 80 : 25;
      if (row.__hay.indexOf(t) > -1) s += 5;
    });
    if (row.__tier === "A") s += 4; else if (row.__tier === "B") s += 2;
    return s;
  }
  function currentRows() {
    var f = state.filters, qn = norm(f.q);
    var tokens = qn ? qn.split(" ").filter(Boolean) : [];
    var digitsOnly = tokens.length === 1 && /^\d+$/.test(tokens[0]);
    var out = state.rows.filter(function (r) {
      if (f.country && norm(val(r, "country")) !== f.country) return false;
      if (f.tier && r.__tier !== f.tier) return false;
      if (f.pstatus && r.__pstatus !== f.pstatus) return false;
      if (f.source && (r.__source || "База") !== f.source) return false;
      var st = state.touch[r.__id] && state.touch[r.__id].status;
      if (f.status && st !== f.status) return false;
      if (f.unvisited && st) return false;
      if (tokens.length && !matches(r, tokens, digitsOnly)) return false;
      return true;
    });
    if (tokens.length) {
      out.sort(function (a, b) { return score(b, tokens, digitsOnly) - score(a, tokens, digitsOnly); });
    } else {
      var rank = { A: 0, B: 1, C: 2 };
      out.sort(function (a, b) {
        /* спершу ті, з ким уже домовлено про зустріч */
        var ma = a.__meet ? 0 : 1, mb = b.__meet ? 0 : 1;
        if (ma !== mb) return ma - mb;
        var ra = rank[a.__tier] != null ? rank[a.__tier] : 3;
        var rb = rank[b.__tier] != null ? rank[b.__tier] : 3;
        if (ra !== rb) return ra - rb;
        return a.__companyN < b.__companyN ? -1 : a.__companyN > b.__companyN ? 1 : 0;
      });
    }
    return out;
  }

  /* ================= список ================= */
  function highlight(text, tokens) {
    if (!tokens.length) return esc(text);
    var out = esc(text), i, re;
    for (i = 0; i < tokens.length; i++) {
      if (tokens[i].length < 2) continue;
      re = new RegExp("(" + tokens[i].replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi");
      out = out.replace(re, "<mark>$1</mark>");
    }
    return out;
  }
  function whyLine(row, tokens) {
    if (!tokens.length) return null;
    var t = tokens[0];
    if (row.__companyN.indexOf(t) > -1 || row.__stand.indexOf(t) > -1) return null;
    for (var k in row) {
      if (k.indexOf("__") === 0) continue;
      if (row[k] && norm(row[k]).indexOf(t) > -1) {
        return "<b>" + esc(k) + ":</b> " + highlight(String(row[k]).slice(0, 120), tokens);
      }
    }
    return null;
  }

  function renderList() {
    var list = $("list"), rows = currentRows();
    var tokens = norm(state.filters.q).split(" ").filter(Boolean);
    list.innerHTML = "";
    renderTimeline(rows);
    $("countLbl").textContent = state.rows.length ? rows.length + " / " + state.rows.length : "база порожня";

    if (!state.rows.length) {
      list.appendChild(emptyState("Тут поки нічого немає",
        "Завантаж базу лідів — Excel або CSV. Файл читається на пристрої, нікуди не відправляється.",
        "Завантажити базу", function () { $("fileInput").click(); }));
      return;
    }
    if (!rows.length) {
      list.appendChild(emptyState("Нічого не знайшлося",
        "Спробуй частину назви, номер стенда або скинь фільтри.",
        "Скинути все", resetFilters));
      return;
    }
    var frag = document.createDocumentFragment();
    rows.slice(0, state.limit).forEach(function (r) { frag.appendChild(rowNode(r, tokens)); });
    list.appendChild(frag);

    if (rows.length > state.limit) {
      var more = el("button", "more", "Показати ще " + Math.min(60, rows.length - state.limit) +
        " з " + (rows.length - state.limit));
      more.addEventListener("click", function () { state.limit += 60; renderList(); });
      list.appendChild(more);
    }
    renderProgress();
  }
  function emptyState(h, p, btnLabel, onClick) {
    var box = el("div", "empty");
    box.appendChild(el("h3", null, h));
    box.appendChild(el("p", null, p));
    var b = el("button", "btn primary", btnLabel);
    b.addEventListener("click", onClick);
    box.appendChild(b);
    return box;
  }

  function rowNode(r, tokens) {
    var t = state.touch[r.__id] || {};
    var node = el("button", "row" + (r.__tier === "A" ? " t-a" : r.__tier === "B" ? " t-b" : ""));
    node.type = "button";
    node.appendChild(el("div", "stripe"));

    var body = el("div", "body");
    var name = el("div", "name");
    name.innerHTML = highlight(r.__company, tokens);
    body.appendChild(name);

    var meta = el("div", "meta");
    var em = effMeet(r);
    if (em) meta.appendChild(el("span", "meetchip" + (em.fixed ? " fixed" : ""), em.label));
    var stand = val(r, "stand");
    if (stand) {
      var sc = el("span", "standchip" + (/\d/.test(stand) ? "" : " unknown"));
      sc.innerHTML = highlight(stand, tokens);
      meta.appendChild(sc);
    }
    var pcls = pstatusClass(r.__pstatus);
    if (r.__pstatus && !(r.__meet && pcls === "p-meet")) {
      meta.appendChild(el("span", "pbadge " + pcls, r.__pstatus));
    }
    var who = [val(r, "person"), val(r, "country")].filter(Boolean).join(" · ");
    if (who) meta.appendChild(el("span", null, who));
    if (t.status) {
      var st = el("span", null, STATUS_LABEL[t.status]);
      st.style.fontWeight = "600";
      meta.appendChild(st);
    }
    body.appendChild(meta);

    /* головне по ліду видно одразу зі списку */
    if (t.summary) body.appendChild(el("span", "summary", t.summary));
    else {
      var why = whyLine(r, tokens);
      if (why) {
        var w = el("span", "hit");
        w.innerHTML = why;
        body.appendChild(w);
      }
    }
    node.appendChild(body);

    var side = el("div", "side");
    if (t.screening && t.screening.verdict) {
      side.appendChild(el("span", "vbadge " + String(t.screening.verdict).toLowerCase(), t.screening.verdict));
    }
    if (t.status) side.appendChild(el("span", "sdot " + t.status));
    if (r.__tier) side.appendChild(el("span", "tierbadge", r.__tier));
    if (t.log && t.log.length) side.appendChild(el("span", "tierbadge", t.log.length + " зап."));
    node.appendChild(side);

    node.addEventListener("click", function () { openLead(r.__id); });
    return node;
  }

  /* Смуга годин: лише ті, у кого є конкретний час, за зростанням,
     і лише в межах поточного фільтра — це «відфільтрована контактна книга». */
  function renderTimeline(rows) {
    var box = $("timeline");
    var now = new Date();
    var items = (rows || currentRows()).map(function (r) {
      var m = effMeet(r);
      return m && m.fixed ? { row: r, m: m } : null;
    }).filter(Boolean).sort(function (a, b) { return a.m.date - b.m.date; });

    if (!items.length) { box.classList.add("hidden"); box.innerHTML = ""; return; }
    box.classList.remove("hidden");
    box.innerHTML = "";

    var head = el("div", "tl-head");
    head.appendChild(el("span", "eyebrow", "За годиною · " + items.length));
    box.appendChild(head);
    var cards = el("div", "tl-cards");
    box.appendChild(cards);

    /* перша ще не минула — та, до якої йти */
    var nextIdx = -1, i;
    for (i = 0; i < items.length; i++) {
      if ((items[i].m.date - now) / 60000 > -25) { nextIdx = i; break; }
    }
    items.forEach(function (it, idx) {
      var st = meetState(it.m.date, now);
      var t = state.touch[it.row.__id] || {};
      var cls = st.cls;
      if (!cls && idx === nextIdx) cls = "next";
      var card = el("button", "tcard" + (cls ? " " + cls : ""));
      card.type = "button";
      card.appendChild(el("div", "t", String(it.m.label).split(", ").pop()));
      card.appendChild(el("div", "c", it.row.__company));
      var stand = val(it.row, "stand");
      card.appendChild(el("div", "s", stand || val(it.row, "person") || ""));
      var when = el("span", "when", idx === nextIdx && !st.cls ? "наступна" : st.text);
      if (t.status) when.appendChild(el("span", "sdot " + t.status));
      card.appendChild(when);
      card.addEventListener("click", function () { openLead(it.row.__id); });
      cards.appendChild(card);
    });
  }

  function renderProgress() {
    var p = $("progress");
    p.innerHTML = "";
    if (!state.rows.length) { p.classList.add("hidden"); return; }
    p.classList.remove("hidden");
    var counts = { talked: 0, hot: 0, later: 0, no: 0 }, done = 0;
    state.rows.forEach(function (r) {
      var t = state.touch[r.__id];
      if (t && t.status && counts[t.status] != null) { counts[t.status]++; done++; }
    });
    var bar = el("div", "bar");
    ["hot", "talked", "later", "no"].forEach(function (k) {
      if (!counts[k]) return;
      var i = el("i", k);
      i.style.width = (counts[k] / state.rows.length * 100) + "%";
      bar.appendChild(i);
    });
    var lbl = el("span", "lbl", done + " / " + state.rows.length + " опрацьовано");
    if (counts.hot) lbl.textContent += " · " + counts.hot + " гарячих";
    p.appendChild(bar);
    p.appendChild(lbl);
  }

  /* ================= чіпи ================= */
  function renderChips() {
    var box = $("quickChips");
    box.innerHTML = "";
    if (!state.rows.length) return;
    var f = state.filters;

    /* стадії з бази — головний спосіб розділити цих лідів */
    countBy(function (r) { return r.__pstatus; }).forEach(function (it) {
      box.appendChild(chip(it[0], f.pstatus === it[0], it[1], function () {
        f.pstatus = f.pstatus === it[0] ? null : it[0];
        state.limit = 60; refresh();
      }));
    });
    box.appendChild(chip("Не відвідані", f.unvisited, null, function () {
      f.unvisited = !f.unvisited; if (f.unvisited) f.status = null; refresh();
    }));
    STATUSES.forEach(function (s) {
      var n = 0;
      state.rows.forEach(function (r) {
        var t = state.touch[r.__id];
        if (t && t.status === s.k) n++;
      });
      if (!n && f.status !== s.k) return;
      box.appendChild(chip(s.label, f.status === s.k, n, function () {
        f.status = f.status === s.k ? null : s.k; f.unvisited = false; refresh();
      }));
    });
    if (f.country) box.appendChild(chip(titleCase(f.country), true, null, function () { f.country = null; refresh(); }));
    if (f.tier) box.appendChild(chip("Пріоритет " + f.tier, true, null, function () { f.tier = null; refresh(); }));
    if (f.source) box.appendChild(chip(f.source, true, null, function () { f.source = null; refresh(); }));
    var open = chip("Ще фільтри", false, null, openFilters);
    open.classList.add("group");
    box.appendChild(open);

    var n = state.rows.filter(function (r) { return r.__meet; }).length;
    $("agendaBadge").textContent = n ? String(n) : "";
  }
  function chip(label, on, n, onClick) {
    var c = el("button", "chip" + (on ? " on" : ""));
    c.type = "button";
    c.appendChild(document.createTextNode(label));
    if (n) c.appendChild(el("span", "n", String(n)));
    c.addEventListener("click", onClick);
    return c;
  }
  function titleCase(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
  function countBy(fn) {
    var m = {}, order = [];
    state.rows.forEach(function (r) {
      var v = fn(r);
      if (!v) return;
      if (!m[v]) { m[v] = 0; order.push(v); }
      m[v]++;
    });
    return order.map(function (v) { return [v, m[v]]; }).sort(function (a, b) { return b[1] - a[1]; });
  }

  /* ================= розклад зустрічей ================= */
  function openAgenda() {
    var sheet = el("div", "sheet");
    sheet.appendChild(sheetHead("Розклад зустрічей", popSheet));
    var body = el("div", "sheet-body"), inner = el("div", "sheet-inner");
    body.appendChild(inner); sheet.appendChild(body);

    var meets = state.rows.filter(function (r) { return effMeet(r); })
      .sort(function (a, b) {
        var ma = effMeet(a), mb = effMeet(b);
        if (ma.date && mb.date) return ma.date - mb.date;
        if (ma.date) return -1;
        if (mb.date) return 1;
        return a.__mkey < b.__mkey ? -1 : a.__mkey > b.__mkey ? 1 : 0;
      });

    if (!meets.length) {
      inner.appendChild(emptyState("Зустрічей у базі немає",
        "Тут з'являться ліди, у яких заповнена колонка з часом зустрічі.", "Закрити", popSheet));
      pushSheet(sheet);
      return;

    var done = meets.filter(function (r) { return state.touch[r.__id] && state.touch[r.__id].status; }).length;
    var head = el("div", "sect");
    head.appendChild(el("span", "eyebrow", meets.length + " зустрічей · " + done + " вже відмічено"));
    inner.appendChild(head);

    var lastDay = null;
    meets.forEach(function (r) {

      if (day !== lastDay) { inner.appendChild(el("div", "daysep", day || "Без дати")); lastDay = day; }
      var t = state.touch[r.__id] || {};

      var tm = em.label.match(/\d{1,2}:\d{2}/);

      if (!tm) { timeCell.style.color = "var(--text-dim)"; timeCell.style.fontSize = "11px"; }

      if (val(r, "person")) sub.appendChild(el("span", null, val(r, "person")));
      if (t.status) {
        var s = el("span", null, STATUS_LABEL[t.status]);
        s.style.fontWeight = "600";
        sub.appendChild(s);
      }
      who.appendChild(sub);
      if (t.summary) who.appendChild(el("span", "summary", t.summary));
      b.appendChild(who);
      if (t.status) b.appendChild(el("span", "sdot " + t.status));
      b.addEventListener("click", function () { openLead(r.__id); });
      inner.appendChild(b);
    });
    pushSheet(sheet);
  }
