[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "google-workspace-connector"
version = "0.1.0"
description = "MCP-конектор для читання та редагування Google Docs і Google Sheets"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0,<2",
    "google-api-python-client>=2.100.0",
    "google-auth>=2.23.0",
    "google-auth-oauthlib>=1.1.0",
]

[project.scripts]
google-workspace-connector = "google_workspace_connector.server:main"

[tool.setuptools.packages.find]
where = ["src"]
