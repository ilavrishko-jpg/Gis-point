# GIS-Point capability catalog — source of truth for the capability-finder skill.
# One entry per project or capability. Anonymized: no client/customer names.
#
# Fields:
#   id            stable slug
#   name          project/capability name
#   area          internal grouping (gis-point | seven | allgis | ons | external)
#   type          product | microservices-platform | oss-integration | tool | website | scoped-engagement
#   status        active | experimental | third-party | scoped
#   client_facing yes | no | unknown  (client engagement vs GIS-Point own product)
#   industry      primary vertical
#   what_it_is    one plain sentence
#   what_its_for  business value / who benefits
#   frontend / backend / mobile / devops / database   headline tech only
#   capabilities  demonstrable, matchable capabilities
#   integrations  notable third-party services/APIs
#   repos         source repos (for internal reference)
#
# Maintenance: add/edit an entry when a project changes; keep names out; bump plugin version.

meta:
  owner: GIS-Point
  entries: 45
  note: >
    "status: scoped" means architected/estimated but not necessarily shipped — present
    as experience, not a delivered product. "type: oss-integration" means GIS-Point
    integrates/hosts that open-source tool, not that it wrote it.

