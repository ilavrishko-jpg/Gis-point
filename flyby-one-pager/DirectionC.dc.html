<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@700;800&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@500;600&display=swap">
  <style>
    body { margin: 0; }
    a { color: #A9761A; text-decoration: none; }
    a:hover { color: #7d560f; }
  </style>
</helmet>

<div style="width: 794px; height: 1123px; overflow: hidden; background: #F4F2ED; color: #10151C; font-family: 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; display: flex; flex-direction: column; padding: 44px; box-sizing: border-box;">

  <div style="font-family: 'IBM Plex Mono', Consolas, monospace; font-size: 11px; letter-spacing: 0.2em; color: #A9761A;">DIRECTION C &mdash; DIAGRAM-LED &middot; LOW-FI SKETCH</div>

  <div style="margin-top: 34px; display: flex; justify-content: space-between; align-items: baseline;">
    <span style="font-family: 'Saira Condensed', 'Arial Narrow', Arial, sans-serif; font-weight: 800; font-size: 34px; letter-spacing: 0.06em;">FLY BY</span>
    <span style="font-family: 'IBM Plex Mono', Consolas, monospace; font-size: 11px; letter-spacing: 0.16em; color: #6E7884;">UK &middot; UKRAINE</span>
  </div>

  <div style="margin-top: 30px; font-family: 'Saira Condensed', 'Arial Narrow', Arial, sans-serif; font-weight: 800; font-size: 44px; line-height: 0.98;">NAVIGATION THAT DOES NOT<br>DEPEND ON A SATELLITE.</div>

  <!-- the diagram is the hero -->
  <div style="margin-top: 34px; border: 2px solid #10151C; padding: 26px; display: flex; flex-direction: column; gap: 18px;">
    <svg width="100%" height="250" viewBox="0 0 640 250" fill="none" stroke="#10151C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <!-- jammed satellite -->
      <circle cx="90" cy="40" r="16"/>
      <path d="M60 22 L120 58 M120 22 L60 58" stroke="#A9761A" stroke-width="3"/>
      <text x="90" y="82" font-family="monospace" font-size="12" fill="#6E7884" stroke="none" text-anchor="middle">GNSS JAMMED</text>

      <!-- drone -->
      <path d="M300 46 h60 M330 46 v22"/>
      <rect x="312" y="68" width="36" height="22" rx="3"/>
      <circle cx="300" cy="46" r="7"/><circle cx="360" cy="46" r="7"/>
      <text x="330" y="112" font-family="monospace" font-size="12" fill="#6E7884" stroke="none" text-anchor="middle">PASSIVE CAMERA</text>

      <!-- view cone -->
      <path d="M320 92 L250 186 M340 92 L410 186" stroke-dasharray="5 5"/>

      <!-- terrain / map -->
      <rect x="230" y="186" width="200" height="44" rx="2"/>
      <path d="M230 208 h200 M280 186 v44 M330 186 v44 M380 186 v44" stroke="#B9B3A6"/>
      <text x="330" y="244" font-family="monospace" font-size="12" fill="#6E7884" stroke="none" text-anchor="middle">ONBOARD REFERENCE MAP</text>

      <!-- fusion arrow to output -->
      <path d="M440 208 h90" stroke="#A9761A" stroke-width="3"/>
      <path d="M520 199 l12 9 -12 9" stroke="#A9761A" stroke-width="3"/>
      <rect x="536" y="180" width="92" height="56" rx="2" fill="#10151C" stroke="none"/>
      <text x="582" y="204" font-family="monospace" font-size="12" fill="#E0A22B" stroke="none" text-anchor="middle">POSITION</text>
      <text x="582" y="222" font-family="monospace" font-size="12" fill="#E0A22B" stroke="none" text-anchor="middle">+ CONFIDENCE</text>
    </svg>
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <span style="display: block; height: 8px; width: 100%; background: #DED9CE;"></span>
      <span style="display: block; height: 8px; width: 74%; background: #DED9CE;"></span>
    </div>
  </div>

  <div style="margin-top: 28px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px;">
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <span style="font-family: 'IBM Plex Mono', Consolas, monospace; font-weight: 600; font-size: 30px;">13.2 m</span>
      <span style="display: block; height: 7px; width: 90%; background: #DED9CE;"></span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <span style="font-family: 'IBM Plex Mono', Consolas, monospace; font-weight: 600; font-size: 30px;">3.34 m</span>
      <span style="display: block; height: 7px; width: 90%; background: #DED9CE;"></span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <span style="font-family: 'IBM Plex Mono', Consolas, monospace; font-weight: 600; font-size: 30px;">7.5 m</span>
      <span style="display: block; height: 7px; width: 90%; background: #DED9CE;"></span>
    </div>
  </div>

  <div style="margin-top: auto; border-top: 2px solid #10151C; padding-top: 14px; display: flex; justify-content: space-between; align-items: flex-end;">
    <span style="font-family: 'Saira Condensed', 'Arial Narrow', Arial, sans-serif; font-weight: 800; font-size: 22px; letter-spacing: 0.04em;">BRITISH COMPANY. UKRAINIAN BATTLEFIELD.</span>
    <span style="width: 66px; height: 66px; border: 1px dashed #9A948A; display: block;"></span>
  </div>

  <div style="margin-top: 14px; font-family: 'IBM Plex Mono', Consolas, monospace; font-size: 11px; letter-spacing: 0.1em; color: #8A857C;">TRADEOFF: BEST FOR ENGINEERS WHO STOP AND READ &mdash; WEAKEST AS A 3-SECOND WALK-PAST GRAB</div>

</div>
</x-dc>
</body>
</html>
